name: Diagnose Metrolist 13.7.1 scroll patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1368-final.yml'

permissions:
  contents: write

concurrency:
  group: metrolist-v1371-patch-diagnosis
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run patch and persist exact output
        run: |
          set -u
          mkdir -p _assistant
          set +e
          python3 scripts/apply_v1371_current_artist_scroll_fix.py > _assistant/v1371_patch_diagnosis.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> _assistant/v1371_patch_diagnosis.txt
          python3 -m py_compile scripts/apply_v1371_current_artist_scroll_fix.py >> _assistant/v1371_patch_diagnosis.txt 2>&1 || true
          bash -n scripts/dudu7_v1371_regression_smoke.sh >> _assistant/v1371_patch_diagnosis.txt 2>&1 || true
          git diff --check >> _assistant/v1371_patch_diagnosis.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(dudu7): record consolidated patch diagnosis [skip ci]'
          git pull --rebase origin main
          git push
