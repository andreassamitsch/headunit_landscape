name: Build validated Metrolist 13.7.1 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1368-final.yml'

permissions:
  contents: write

concurrency:
  group: metrolist-v1371-release
  cancel-in-progress: true

jobs:
  build-arm:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Record release run
        run: |
          set -euxo pipefail
          mkdir -p _assistant
          printf 'run_id=%s\nstatus=running\nsource_commit=%s\nui_validation_run=30090964124\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > _assistant/v1371_release_build_run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _assistant/v1371_release_build_run.txt
          git commit -m 'build(dudu7): record 13.7.1 release run [skip ci]'
          git pull --rebase origin main
          git push

      - name: Verify validated source markers
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'versionCode = 160' app/build.gradle.kts
          grep -q 'versionName = "13.7.1"' app/build.gradle.kts
          grep -q 'Dudu7RightPaneScroll' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'Dudu7RightPaneTap' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'rightPaneScrollBridge.dispatchTap' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'tapHandler:' app/src/main/kotlin/com/metrolist/music/ui/component/RightPaneScrollBridge.kt
          grep -q 'rightPaneTapTargets\[sectionTapKey\]' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'coordinates.boundsInRoot() to sectionClick' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'browseId=__artist_songs__&params=' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'browseId == "__artist_songs__"' app/src/main/kotlin/com/metrolist/music/viewmodels/ArtistItemsViewModel.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build and verify ARM APK
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-arm.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Metrolist-Dudu7-13.7.1.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging artifacts/Metrolist-Dudu7-13.7.1.apk | tee artifacts/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs artifacts/Metrolist-Dudu7-13.7.1.apk | tee artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='160'" artifacts/apk-badging.txt
          unzip -l artifacts/Metrolist-Dudu7-13.7.1.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum artifacts/Metrolist-Dudu7-13.7.1.apk | tee artifacts/SHA256SUMS.txt
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-13.7.1-release-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
