name: Build Metrolist 13.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1368-final.yml'

permissions:
  contents: write

concurrency:
  group: metrolist-v1370-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      METROLIST_APP_NAME: Metrolist

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply requested fixes
        run: |
          set -euo pipefail
          python3 scripts/apply_v1370_requested_fixes.py
          python3 -m py_compile scripts/apply_v1370_requested_fixes.py
          git diff --check

          grep -q 'versionCode = 159' app/build.gradle.kts
          grep -q 'versionName = "13.7.0"' app/build.gradle.kts
          grep -q 'val safePlayerWeight = 0.5f' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'embeddedInPlayer = embeddedInPlayer' app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt
          grep -q 'drag_indicator_grid' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'Alignment.BottomEnd' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'surfaceVariant.copy(alpha = 0.55f)' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'fun toggleShuffle()' app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
          grep -q 'ShuffleOrder.DefaultShuffleOrder' app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
          grep -q 'onToggleShuffle = playerConnection::toggleShuffle' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          grep -q 'recognizeStream(streamUrl)' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          grep -q 'fun recognizeStream(streamUrl: String)' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          test -f app/src/main/res/drawable/drag_indicator_grid.xml

          mkdir -p _assistant
          printf 'run_id=%s\njob_status=building\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > _assistant/v1370_build_run.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(dudu7): implement requested player and radio updates [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build ARM update APK
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-arm.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Verify and package APK
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Metrolist-Dudu7-13.7.0.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging artifacts/Metrolist-Dudu7-13.7.0.apk | tee artifacts/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs artifacts/Metrolist-Dudu7-13.7.0.apk | tee artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='159'" artifacts/apk-badging.txt
          unzip -l artifacts/Metrolist-Dudu7-13.7.0.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum artifacts/Metrolist-Dudu7-13.7.0.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-13.7.0-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
