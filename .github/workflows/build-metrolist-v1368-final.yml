name: Build and regression-test Metrolist 13.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1368-final.yml'

permissions:
  contents: write

concurrency:
  group: metrolist-v1371-regression
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      METROLIST_APP_NAME: Metrolist
      API_LEVEL: '33'
      SYSTEM_TARGET: google_apis
      DATA_PARTITION_SIZE: 1536M
      DUDU_WIDTH: '1280'
      DUDU_HEIGHT: '720'
      DUDU_DENSITY: '200'
      TEST_URL: https://music.youtube.com/watch?v=dQw4w9WgXcQ
      PACKAGE_NAME: com.metrolist.music.dudu7.debug
      ACTIVITY_NAME: com.metrolist.music.MainActivity
      RESULTS_DIR: ui-test-results
      APK_PATH: dist/Metrolist-Dudu7-13.7.1-emulator.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply scroll fix and regression instrumentation
        run: |
          set -euxo pipefail
          python3 scripts/apply_v1371_regression_fixes.py
          python3 -m py_compile scripts/apply_v1371_regression_fixes.py
          bash -n scripts/dudu7_v1371_regression_smoke.sh
          git diff --check

          grep -q 'versionCode = 160' app/build.gradle.kts
          grep -q 'versionName = "13.7.1"' app/build.gradle.kts
          grep -A5 'weight(1f - safePlayerWeight)' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt | grep -q 'nestedScroll(state.preUpPostDownNestedScrollConnection)'
          grep -A5 'LazyColumn(' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt | grep -q 'modifier = Modifier.fillMaxSize()'
          grep -q 'userScrollEnabled = true' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'artist/{artistId}/items?browseId={browseId}&params={params}' app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt
          grep -q 'Shuffle enabled with fresh seed=' app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
          grep -q 'Shuffle disabled; original timeline order active' app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
          grep -q 'Direct radio stream decoded:' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          grep -q 'recognizeStream(streamUrl)' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          grep -q 'drag_indicator_grid' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'surfaceVariant.copy(alpha = 0.55f)' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'assert_scroll_moved' scripts/dudu7_v1371_regression_smoke.sh

          mkdir -p _assistant
          printf 'run_id=%s\njob_status=testing\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > _assistant/v1371_regression_run.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(dudu7): restore right-pane scrolling and add regression evidence [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build ARM update APK
        run: |
          set -o pipefail
          mkdir -p artifacts "$RESULTS_DIR"
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-arm.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Verify and package ARM APK
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Metrolist-Dudu7-13.7.1.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/aapt" dump badging artifacts/Metrolist-Dudu7-13.7.1.apk | tee artifacts/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs artifacts/Metrolist-Dudu7-13.7.1.apk | tee artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='160'" artifacts/apk-badging.txt
          unzip -l artifacts/Metrolist-Dudu7-13.7.1.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum artifacts/Metrolist-Dudu7-13.7.1.apk | tee artifacts/SHA256SUMS.txt

      - name: Build x86_64 emulator APK
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          if old not in text:
              raise SystemExit('Expected ARM ABI declaration not found')
          path.write_text(text.replace(old, 'abiFilters += listOf("x86_64")', 1), encoding='utf-8')
          PY
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-x86.log
          mkdir -p dist
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$APK_PATH"
          unzip -l "$APK_PATH" | grep 'lib/x86_64/'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare deterministic radio streams
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p radio-test-data "$RESULTS_DIR"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station1.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=660:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station2.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=880:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station3.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=0x4f46e5:s=512x512' -frames:v 1 radio-test-data/logo3.png
          python3 scripts/icy_test_server.py \
            --audio1 radio-test-data/station1.mp3 \
            --audio2 radio-test-data/station2.mp3 \
            --audio3 radio-test-data/station3.mp3 \
            --logo3 radio-test-data/logo3.png \
            > "$RESULTS_DIR/icy-server.log" 2>&1 &
          echo $! > "$RESULTS_DIR/icy-server.pid"
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Free disk space for emulator
        run: |
          ./gradlew --stop || true
          find . -type d -name build -prune -exec rm -rf {} +
          rm -rf "$HOME/.gradle/caches/transforms-"* || true
          test -f "$APK_PATH"
          df -h

      - name: Run focused Dudu7 regression
        run: |
          set -euxo pipefail
          cp scripts/dudu7_v1371_regression_smoke.sh scripts/dudu7_ui_smoke.sh
          chmod +x scripts/run_dudu7_emulator_ci.sh scripts/dudu7_ui_smoke.sh
          scripts/run_dudu7_emulator_ci.sh

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-13.7.1-${{ github.run_id }}
          path: |
            artifacts/
            ui-test-results/
          if-no-files-found: warn
          retention-days: 14
