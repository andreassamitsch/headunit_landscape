name: Regression-test Metrolist 13.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1368-final.yml'

concurrency:
  group: metrolist-v1371-emulator
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      METROLIST_APP_NAME: Metrolist
      API_LEVEL: '33'
      SYSTEM_TARGET: google_apis
      DATA_PARTITION_SIZE: 1536M
      DUDU_WIDTH: '1280'
      DUDU_HEIGHT: '720'
      DUDU_DENSITY: '200'
      TEST_URL: https://music.youtube.com/watch?v=dQw4w9WgXcQ
      PACKAGE_NAME: com.metrolist.music.dudu7.debug
      ACTIVITY_NAME: com.metrolist.music.MainActivity
      RESULTS_DIR: ui-test-results
      APK_PATH: dist/Metrolist-Dudu7-13.7.1-emulator.apk

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify corrected source and test harness
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/apply_v1371_regression_fixes.py
          bash -n scripts/dudu7_v1371_regression_smoke.sh
          grep -q 'versionCode = 160' app/build.gradle.kts
          grep -q 'versionName = "13.7.1"' app/build.gradle.kts
          grep -A5 'weight(1f - safePlayerWeight)' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt | grep -q 'nestedScroll(state.preUpPostDownNestedScrollConnection)'
          grep -A5 'LazyColumn(' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt | grep -q 'modifier = Modifier.fillMaxSize()'
          grep -q 'userScrollEnabled = true' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'assert_scroll_moved' scripts/dudu7_v1371_regression_smoke.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build only the x86_64 test APK
        run: |
          set -euxo pipefail
          mkdir -p artifacts dist "$RESULTS_DIR"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          if old not in text:
              raise SystemExit('Expected ARM ABI declaration not found')
          path.write_text(text.replace(old, 'abiFilters += listOf("x86_64")', 1), encoding='utf-8')
          PY
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-x86.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$APK_PATH"
          unzip -l "$APK_PATH" | grep 'lib/x86_64/'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare deterministic radio streams
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p radio-test-data "$RESULTS_DIR"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station1.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=660:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station2.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=880:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station3.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=0x4f46e5:s=512x512' -frames:v 1 radio-test-data/logo3.png
          python3 scripts/icy_test_server.py \
            --audio1 radio-test-data/station1.mp3 \
            --audio2 radio-test-data/station2.mp3 \
            --audio3 radio-test-data/station3.mp3 \
            --logo3 radio-test-data/logo3.png \
            > "$RESULTS_DIR/icy-server.log" 2>&1 &
          echo $! > "$RESULTS_DIR/icy-server.pid"
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Free disk space for emulator
        run: |
          ./gradlew --stop || true
          find . -type d -name build -prune -exec rm -rf {} +
          rm -rf "$HOME/.gradle/caches/transforms-"* || true
          test -f "$APK_PATH"
          df -h

      - name: Enable KVM access
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run focused Dudu7 regression
        run: |
          set -euxo pipefail
          cp scripts/dudu7_v1371_regression_smoke.sh scripts/dudu7_ui_smoke.sh
          chmod +x scripts/run_dudu7_emulator_ci.sh scripts/dudu7_ui_smoke.sh
          scripts/run_dudu7_emulator_ci.sh

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-13.7.1-regression-${{ github.run_id }}
          path: |
            artifacts/
            ui-test-results/
          if-no-files-found: warn
          retention-days: 14
