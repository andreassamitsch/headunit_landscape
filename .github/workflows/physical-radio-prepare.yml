name: Diagnose Dudu7 Physical Radio Prepare

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Run prepare diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p dist
          {
            echo '=== architecture ==='
            python3 scripts/verify_dudu7_architecture.py
            echo "architecture_status=$?"
            echo
            echo '=== diff check ==='
            git diff --check main...HEAD
            echo "diff_status=$?"
            echo
            echo '=== changed files ==='
            git diff --name-only main...HEAD
          } > dist/physical-radio-prepare.txt 2>&1
          cat dist/physical-radio-prepare.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/physical-radio-prepare.txt
          git commit -m "test(dudu7): record prepare diagnostics [skip ci]"
          git push origin HEAD:agent/dudu7-physical-radio
