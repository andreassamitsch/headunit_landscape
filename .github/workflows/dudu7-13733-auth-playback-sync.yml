name: Dudu7 13.7.33 authenticated playback sync

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - '.github/workflows/dudu7-13733-auth-playback-sync.yml'
      - 'scripts/apply_dudu7_13733_auth_playback_sync.py'
      - 'app/build.gradle.kts'
      - 'app/src/main/assets/player_configs.json'
      - 'app/src/main/assets/player_dates.json'
      - 'app/src/main/kotlin/com/metrolist/music/ui/screens/LoginScreen.kt'
      - 'app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt'
      - 'app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply original MetroList auth and playback sync
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'versionCode = 1370042' app/build.gradle.kts; then
            echo '13.7.33 sync already applied'
          else
            python3 scripts/apply_dudu7_13733_auth_playback_sync.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              app/build.gradle.kts \
              app/src/main/assets/player_configs.json \
              app/src/main/assets/player_dates.json \
              app/src/main/kotlin/com/metrolist/music/ui/screens/LoginScreen.kt \
              app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt \
              app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
            git commit -m 'Sync authenticated playback with original MetroList'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Verify exact upstream auth scope
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM=2504604637e8c6ddcc5efbf3894957d6eb2c6b04
          for path in \
            app/src/main/assets/player_configs.json \
            app/src/main/assets/player_dates.json \
            app/src/main/kotlin/com/metrolist/music/ui/screens/LoginScreen.kt \
            app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt
          do
            curl -fsSL "https://raw.githubusercontent.com/MetrolistGroup/Metrolist/$UPSTREAM/$path" -o /tmp/upstream-file
            cmp --silent "$path" /tmp/upstream-file || {
              echo "$path differs from pinned original MetroList"
              exit 1
            }
          done

          grep -q '"292d23a7"' app/src/main/assets/player_configs.json
          grep -q '"7f1636e3"' app/src/main/assets/player_configs.json
          grep -q '"ce48a839"' app/src/main/assets/player_configs.json
          grep -q 'Runtime.getRuntime().exit(0)' app/src/main/kotlin/com/metrolist/music/ui/screens/LoginScreen.kt
          ! grep -q 'handleAuthenticatedStreamFailure' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'versionCode = 1370042' app/build.gradle.kts
          grep -q 'versionName = "13.7.33"' app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run complete Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build update-compatible APK
        env:
          METROLIST_APP_NAME: Metrolist dudu7
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Prepare and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist-dudu7-13.7.33.apk'
          sha256sum 'artifact/Metrolist-dudu7-13.7.33.apk' | tee 'artifact/Metrolist-dudu7-13.7.33.apk.sha256'

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging 'artifact/Metrolist-dudu7-13.7.33.apk' | tee artifact/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist-dudu7-13.7.33.apk' | tee artifact/apk-signature.txt
          unzip -l 'artifact/Metrolist-dudu7-13.7.33.apk' > artifact/apk-list.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370042' versionName='13.7.33-dudu7'" artifact/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifact/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifact/apk-signature.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-list.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-list.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.33
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
