name: Build Dudu7 13.7.62 Haze backdrop blur

on:
  pull_request:
    branches: [agent/issues-114-116-118-119-blur-artwork]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"

      - name: Apply Issue 119 Haze implementation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('scripts/apply_issue_119_haze.py')
          text = path.read_text()
          text = text.replace("    ) {\n'',\n)\nreplace_once(", "    ) {\n''',\n)\nreplace_once(", 1)
          text = text.replace("(?=                    if \\(frostedIceEnabled && glassAlpha > 0f\\))''',\n    ''',\n    flags=re.S,", "(?=                    if \\(frostedIceEnabled && glassAlpha > 0f\\))''',\n    '',\n    flags=re.S,", 1)
          path.write_text(text)
          PYFIX
          python3 -m py_compile scripts/apply_issue_119_haze.py
          if grep -q 'versionCode = 1370071' app/build.gradle.kts; then
            echo 'Haze product patch already applied.'
          else
            python3 scripts/apply_issue_119_haze.py
          fi
          python3 - <<'PYIMPORT'
          from pathlib import Path
          path = Path('app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt')
          text = path.read_text()
          required_import = 'import androidx.compose.ui.layout.positionInRoot\n'
          if '.positionInRoot()' in text and required_import not in text:
              marker = 'import androidx.compose.ui.layout.onGloballyPositioned\n'
              if marker not in text:
                  raise RuntimeError('Unable to restore positionInRoot import')
              text = text.replace(marker, marker + required_import, 1)
              path.write_text(text)
          PYIMPORT
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app gradle/libs.versions.toml scripts/apply_issue_119_haze.py
            git commit -m "Complete Dudu7 Haze backdrop integration [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify Haze implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          DUDU7_LAYOUT=app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          DUDU7_HAZE=app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleHaze.kt
          STANDARD_HAZE=app/src/standard/kotlin/com/metrolist/music/variant/VehicleHaze.kt

          grep -q 'versionCode = 1370071' app/build.gradle.kts
          grep -q 'versionName = "13.7.62"' app/build.gradle.kts
          grep -q 'haze = "1.7.2"' gradle/libs.versions.toml
          grep -q '"dudu7Implementation"(libs.haze)' app/build.gradle.kts
          grep -q 'vehicleHazeSource(vehicleHazeState)' "$PLAYER"
          grep -q 'hazeState = vehicleHazeState' "$PLAYER"
          grep -q 'hazeSource(state = state.delegate' "$DUDU7_HAZE"
          grep -q 'hazeEffect(state = state.delegate)' "$DUDU7_HAZE"
          grep -q 'HazeInputScale.Auto' "$DUDU7_HAZE"
          grep -q 'noiseFactor = 0f' "$DUDU7_HAZE"
          grep -q 'vehicleHazeEffect(' "$DUDU7_LAYOUT"
          grep -q 'import androidx.compose.ui.layout.positionInRoot' "$DUDU7_LAYOUT"
          test -s "$STANDARD_HAZE"
          ! grep -q 'GlassBackdropLayer' "$DUDU7_LAYOUT"
          ! grep -q 'requiredSize(' "$DUDU7_LAYOUT"
          ! grep -q 'glassPaneOriginInRoot' "$DUDU7_LAYOUT"

      - name: Compile standard flavor bridge
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:compileGmsStandardDebugKotlin --no-daemon --stacktrace

      - name: Dudu7 unit tests
        run: |
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.62.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.62.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.62.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370071'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.62.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.62.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.62.apk > artifacts/Metrolist-dudu7-13.7.62.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.62-apk
          path: |
            artifacts/Metrolist-dudu7-13.7.62.apk
            artifacts/Metrolist-dudu7-13.7.62.apk.sha256
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
          retention-days: 14
