name: Dudu7 recognition inventory

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-recognition-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          fetch-depth: 0

      - name: Collect recognition integration context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-metadata
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo
            echo "=== matching files ==="
            find app/src -type f | grep -Ei 'shazam|recogn|fingerprint' || true
            echo
            echo "=== recognition references ==="
            grep -R -n -E 'RecognitionResult|applyRecognizedRadioTrack|Musik erkennen|Shazam|recogniz|fingerprint' app/src/main app/src/dudu7 2>/dev/null || true
          } > .build-metadata/dudu7-recognition-inventory.txt

      - name: Record inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .build-metadata/dudu7-recognition-inventory.txt
          git commit -m "Record Dudu7 recognition inventory [skip ci]" || exit 0
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
