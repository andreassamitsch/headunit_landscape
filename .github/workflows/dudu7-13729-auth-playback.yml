name: Dudu7 13.7.29 auth and playback validation

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - 'scripts/apply_v13729_auth_playback_fix.py'
      - '.github/workflows/dudu7-13729-auth-playback.yml'
      - 'app/**'
      - 'innertube/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply source fixes
        run: python3 scripts/apply_v13729_auth_playback_fix.py

      - name: Verify intended fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'innertube/src/main/kotlin/com/metrolist/innertube/InnerTube.kt': [
                  'field = normalized?.takeIf { "SAPISID" in parsed }',
              ],
              'app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AccountSettings.kt': [
                  'parseAdvancedLoginToken(data)',
                  'navController.navigate(destination) { launchSingleTop = true }',
              ],
              'app/src/main/kotlin/com/metrolist/music/ui/screens/LoginScreen.kt': [
                  'No usable YouTube Music SAPISID cookie',
                  'safe relaunch failed',
              ],
              'app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt': [
                  'Skipping WEB_REMIX because its real playback GET failed',
              ],
              'app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt': [
                  'WEB_REMIX IO_UNSPECIFIED detected',
                  'handleAuthenticatedStreamFailure',
              ],
              'app/build.gradle.kts': [
                  'versionCode = 1370038',
                  'versionName = "13.7.29"',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, f'{needle!r} missing from {path}'
          print('All intended 13.7.29 changes are present')
          PY

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/LoginScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AccountSettings.kt \
            app/src/main/kotlin/com/metrolist/music/utils/AdvancedLoginToken.kt \
            app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt \
            app/src/main/kotlin/com/metrolist/music/viewmodels/AccountSettingsViewModel.kt \
            app/src/test/kotlin/com/metrolist/music/utils/AdvancedLoginTokenTest.kt \
            innertube/src/main/kotlin/com/metrolist/innertube/InnerTube.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix Dudu7 login, token import and authenticated playback [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF:-agent/dudu7-13729-auth-playback-fix}
          fi

      - name: Run focused token tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --tests 'com.metrolist.music.utils.AdvancedLoginTokenTest' --stacktrace

      - name: Run all Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build update-compatible APK
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.dudu7
          METROLIST_APP_NAME: Metrolist dudu7
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Prepare and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/gms/dudu7/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist-dudu7-13.7.29.apk'
          sha256sum 'artifact/Metrolist-dudu7-13.7.29.apk' | tee 'artifact/Metrolist-dudu7-13.7.29.apk.sha256'

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging 'artifact/Metrolist-dudu7-13.7.29.apk' | tee artifact/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist-dudu7-13.7.29.apk' | tee artifact/apk-signature.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370038' versionName='13.7.29-dudu7'" artifact/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifact/apk-badging.txt
          grep -q '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifact/apk-signature.txt
          unzip -l 'artifact/Metrolist-dudu7-13.7.29.apk' | grep -q 'lib/arm64-v8a/'
          unzip -l 'artifact/Metrolist-dudu7-13.7.29.apk' | grep -q 'lib/armeabi-v7a/'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.29
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
