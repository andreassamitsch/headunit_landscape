name: Validate Issue 58 FYT Legacy Session

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs

permissions:
  contents: read

jobs:
  test-build:
    if: github.event.pull_request.head.ref == 'agent/issue-58-fyt-legacy-media-session'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build version 13.7.36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          old = '        versionCode = 1370044\n        versionName = "13.7.35"'
          new = '        versionCode = 1370045\n        versionName = "13.7.36"'
          if text.count(old) != 1:
              raise SystemExit('Expected 13.7.35 version block exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Full Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "Metrolist dudu7 13.7.36.apk"
          sha256sum "Metrolist dudu7 13.7.36.apk" | tee "Metrolist dudu7 13.7.36.apk.sha256"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -n 1)"
          "$AAPT" dump badging "Metrolist dudu7 13.7.36.apk" | grep -E "package: name='com.metrolist.music.dudu7.debug'.*versionCode='1370045'.*versionName='13.7.36-dudu7'"
          unzip -l "Metrolist dudu7 13.7.36.apk" | grep 'lib/arm64-v8a/'
          unzip -l "Metrolist dudu7 13.7.36.apk" | grep 'lib/armeabi-v7a/'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "Metrolist dudu7 13.7.36.apk" | grep 'Verified using v2 scheme (APK Signature Scheme v2): true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.36
          path: |
            Metrolist dudu7 13.7.36.apk
            Metrolist dudu7 13.7.36.apk.sha256
          if-no-files-found: error
