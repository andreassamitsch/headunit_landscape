name: Build Dudu7 13.7.61 blur and artwork

on:
  pull_request:
    branches: [agent/issues-111-116-radio-ui-unification]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"

      - name: Apply issues 114 115 116 118 119
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionCode = 1370070' app/build.gradle.kts; then
            echo 'Product patch already applied.'
          else
            python3 scripts/repair_issues_114_116_118_119_patch.py
            python3 scripts/apply_issues_114_116_118_119.py
          fi
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              scripts/apply_issues_114_116_118_119.py \
              app/build.gradle.kts \
              app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt \
              app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt \
              app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoCache.kt \
              app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt \
              app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt \
              app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt \
              app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
              app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
            git commit -m "Refine Dudu7 blur artwork and radio card actions [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          LAYOUT=app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          CONNECTION=app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
          WEB=app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          FM=app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          SETTINGS=app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt
          LOGO=app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoCache.kt

          grep -q 'versionCode = 1370070' app/build.gradle.kts
          grep -q 'versionName = "13.7.61"' app/build.gradle.kts
          grep -q 'steps = 199' "$SETTINGS"
          grep -q 'steps = 23' "$SETTINGS"
          grep -q 'MAX_TARGET_SIZE = 1600' "$LOGO"
          grep -q 'dudu7HighResolutionArtworkUrl' "$PLAYER"
          ! grep -A8 -B2 'data(thumbnailUrl)' "$PLAYER" | grep -q 'size(100, 100)'
          grep -q 'radioHasTrackArtwork' "$CONNECTION"
          grep -q 'showRadioStationLogoOverlay = isWebRadio && radioHasTrackArtwork' "$PLAYER"
          grep -q 'hasRecognizedTrackArtwork' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          grep -q 'private fun GlassBackdropLayer' "$LAYOUT"
          grep -q 'frostedIceEnabled && frostedBlurStrength > 0)' "$LAYOUT"
          grep -q 'color = if (frostedIceEnabled) Color.Transparent' "$LAYOUT"
          grep -q 'align(Alignment.BottomStart)' "$WEB"
          grep -q 'FmRadioViewTypeKey' "$FM"
          grep -q 'private fun FmFavouriteCard' "$FM"
          grep -q 'align(Alignment.BottomStart)' "$FM"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.61.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.61.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.61.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370070'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.61.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.61.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.61.apk > artifacts/Metrolist-dudu7-13.7.61.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.61-apk
          path: |
            artifacts/Metrolist-dudu7-13.7.61.apk
            artifacts/Metrolist-dudu7-13.7.61.apk.sha256
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
          retention-days: 14
