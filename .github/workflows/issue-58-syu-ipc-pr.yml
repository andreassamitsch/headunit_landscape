name: Validate Dudu7 Syu IPC prototype

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - 'app/**'
      - 'metroproto/**'

jobs:
  validate-syu-ipc:
    if: github.head_ref == 'agent/issue-58-syu-ipc-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify safety and protocol constraints
        shell: bash
        run: |
          set -euo pipefail
          IPC=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt
          RADIO=app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          ROUTING=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt

          grep -q 'versionCode = 1370052' app/build.gradle.kts
          grep -q 'versionName = "13.7.43"' app/build.gradle.kts
          grep -q 'Dudu7SyuRadioIpc.install(appContext)' "$ROUTING"
          grep -q 'Dudu7SyuRadioIpc.claimFmSource()' "$RADIO"
          grep -q 'Dudu7SyuRadioIpc.releaseFmSource()' "$RADIO"
          grep -q 'SYU_MAIN_COMMAND_SOURCE = 0' "$IPC"
          grep -q 'SYU_RADIO_SOURCE_PAYLOAD = intArrayOf(1)' "$IPC"
          grep -q 'decision=log_only_not_routed' "$IPC"
          ! grep -q 'PhysicalFmMediaKeyBridge' "$IPC"
          ! grep -Eq 'command[[:space:]]*=[[:space:]]*26|cmd\([^)]*26' "$IPC"

          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt').read_text()
          claim = text.index('Dudu7SyuRadioIpc.claimFmSource()')
          open_dev = text.index('val openOk = fm.openDev()', claim)
          if not claim < open_dev:
              raise SystemExit('Syu source claim must happen before FmNative.openDev')
          PY

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.43.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.43.apk' > 'artifact/Metrolist dudu7 13.7.43.apk.sha256'

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging 'artifact/Metrolist dudu7 13.7.43.apk' > artifact/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist dudu7 13.7.43.apk' > artifact/apksigner.txt
          unzip -l 'artifact/Metrolist dudu7 13.7.43.apk' > artifact/apk-contents.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370052' versionName='13.7.43-dudu7'" artifact/aapt-badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/apksigner.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-contents.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.43-syu-ipc
          path: artifact/*
          if-no-files-found: error
