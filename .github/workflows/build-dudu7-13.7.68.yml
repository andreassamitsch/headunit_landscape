name: Build Dudu7 13.7.68 search queue and Home tab

on:
  pull_request:
    branches: [agent/issues-130-131-updater-download-playback]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build-emulate-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"

      - name: Apply Issues 133 and 134
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/apply_issues_133_134.py
          if grep -q 'versionCode = 1370077' app/build.gradle.kts; then
            echo 'Product patch already applied.'
          else
            python3 scripts/apply_issues_133_134.py
          fi
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app scripts/apply_issues_133_134.py
            git commit -m "Fix explicit search queue and add Dudu7 Home tab [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 1370077' app/build.gradle.kts
          grep -q 'versionName = "13.7.68"' app/build.gradle.kts
          COORD=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SourcePlaybackCoordinator.kt
          TEST=app/src/test/kotlin/com/metrolist/music/playback/Dudu7SourcePlaybackCoordinatorTest.kt
          VEHICLE=app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          TABS=app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleTabOrderStore.kt
          grep -q 'memory.markUserYtSelection(requiresRestoreBypass = true)' "$COORD"
          ! grep -q 'requiresRestoreBypass = current != Dudu7PlaybackSource.YT_MUSIC' "$COORD"
          grep -q 'explicit YT selection while YT is already active bypasses stale queue restore once' "$TEST"
          grep -q 'HOME("Home", R.drawable.home_outlined, Screens.Home.route)' "$VEHICLE"
          grep -q '"HOME",' "$TABS"
          grep -q 'composable(Screens.Home.route)' app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt
          grep -q 'HomeScreen(snackbarHostState = snackbarHostState)' app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt
          test -f scripts/run_issues_133_134_home_emulator.sh

      - name: Compile standard flavor
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:compileGmsStandardDebugKotlin --no-daemon --stacktrace

      - name: Dudu7 unit tests
        run: |
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify production APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.68.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.68.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.68.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370077'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.68.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.68.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.68.apk > artifacts/Metrolist-dudu7-13.7.68.apk.sha256

      - name: Prepare x86_64 emulator APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build.gradle.kts /tmp/build.gradle.kts.production
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          if old not in s:
              raise SystemExit('production ABI filter anchor not found')
          p.write_text(s.replace(old, 'abiFilters += listOf("x86_64")', 1))
          PY
          rm -rf app/build/outputs/apk/gmsDudu7/debug
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/emulator-build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.68-x86_64-test.apk
          unzip -l artifacts/Metrolist-dudu7-13.7.68-x86_64-test.apk > artifacts/emulator-apk-contents.txt
          grep -q 'lib/x86_64/' artifacts/emulator-apk-contents.txt
          cp /tmp/build.gradle.kts.production app/build.gradle.kts

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulate Home tab in portrait and landscape
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_issues_133_134_home_emulator.sh

      - name: Prepare durable Dudu7 release manifest
        shell: bash
        run: |
          set -euxo pipefail
          SHA=$(awk '{print $1}' artifacts/Metrolist-dudu7-13.7.68.apk.sha256)
          SIGNER='138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee'
          grep -qi "$SIGNER" artifacts/apk-signature.txt
          cat > artifacts/dudu7-update.json <<JSON
          {
            "versionCode": 1370077,
            "versionName": "13.7.68",
            "packageName": "com.metrolist.music.dudu7.debug",
            "signerSha256": "$SIGNER",
            "apkAsset": "Metrolist-dudu7-13.7.68.apk",
            "sha256": "$SHA"
          }
          JSON
          cat > artifacts/release-notes.md <<'MD'
          ## MetroList dudu7 13.7.68

          **Such-Wiedergabe korrigiert**
          - explizite Suchtreffer ersetzen zuverlässig die vorherige Favoriten-Queue
          - auch wiederholte Suchauswahl innerhalb einer bereits aktiven YT-Quelle unterdrückt einmalig die alte Queue-Wiederherstellung

          **Home-Tab für Dudu7**
          - originale MetroList-Home-Ansicht mit Vorschlägen, Mixes und Empfehlungen als zusätzlicher Dudu7-Tab
          - originale Unterseiten und bestehende Dudu7-Navigation werden weiterverwendet
          - funktioniert in Landscape und Portrait

          Bezieht sich auf #133 und #134. Basis: 13.7.67.
          MD

      - name: Publish Dudu7 development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='dudu7-v13.7.68'
          TARGET=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'MetroList dudu7 13.7.68' --notes-file artifacts/release-notes.md --prerelease
            gh release upload "$TAG" artifacts/Metrolist-dudu7-13.7.68.apk artifacts/Metrolist-dudu7-13.7.68.apk.sha256 artifacts/dudu7-update.json --clobber
          else
            gh release create "$TAG" artifacts/Metrolist-dudu7-13.7.68.apk artifacts/Metrolist-dudu7-13.7.68.apk.sha256 artifacts/dudu7-update.json --target "$TARGET" --title 'MetroList dudu7 13.7.68' --notes-file artifacts/release-notes.md --prerelease
          fi

      - name: Verify public update channel
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          url = 'https://api.github.com/repos/andreassamitsch/headunit_landscape/releases?per_page=20'
          for attempt in range(8):
              req = urllib.request.Request(url, headers={'User-Agent':'Metrolist-dudu7-ci','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  releases = json.load(response)
              release = next((r for r in releases if r['tag_name'] == 'dudu7-v13.7.68'), None)
              if release:
                  assets = {a['name']: a['browser_download_url'] for a in release['assets']}
                  if 'Metrolist-dudu7-13.7.68.apk' in assets and 'dudu7-update.json' in assets:
                      with urllib.request.urlopen(assets['dudu7-update.json'], timeout=30) as response:
                          manifest = json.load(response)
                      assert manifest['versionCode'] == 1370077
                      assert manifest['packageName'] == 'com.metrolist.music.dudu7.debug'
                      assert manifest['sha256']
                      print('public 13.7.68 update channel verified')
                      break
              if attempt == 7:
                  raise RuntimeError('13.7.68 release not publicly readable')
              time.sleep(5)
          PY

      - name: Upload verified APK, emulator evidence and release metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.68-apk-home-evidence
          path: |
            artifacts/Metrolist-dudu7-13.7.68.apk
            artifacts/Metrolist-dudu7-13.7.68.apk.sha256
            artifacts/dudu7-update.json
            artifacts/release-notes.md
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
            artifacts/emulator-build.log
            artifacts/emulator-apk-contents.txt
            artifacts/home-ui-pre.xml
            artifacts/home-portrait-ui.xml
            artifacts/home-portrait.png
            artifacts/home-landscape-ui.xml
            artifacts/home-landscape.png
            artifacts/home-activity-top.txt
            artifacts/home-emulator-logcat.txt
          retention-days: 14
