name: Build Dudu7 13.7.10 FM Favorites Stereo AF

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and verify focused 13.7.10 changes
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee apply-output.log) 2>&1
          trap 'status=$?; if [ "$status" -ne 0 ]; then mkdir -p _assistant; cp apply-output.log _assistant/dudu7-13710-apply-errors.txt; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add _assistant/dudu7-13710-apply-errors.txt; git commit -m "diag(dudu7): capture 13.7.10 apply errors [skip ci]" || true; git push origin HEAD:${GITHUB_HEAD_REF} || true; fi; exit "$status"' EXIT
          set -ex
          if grep -q 'versionCode = 169' app/build.gradle.kts \
             && grep -q 'fun updatePreset(' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt \
             && grep -q 'public int getStereoState()' app/src/dudu7/java/com/android/fmradio/FmNative.java; then
            echo 'Source already patched.'
          else
            python3 scripts/apply_dudu7_13710_fm_favourites_stereo_af.py
          fi
          python3 -m py_compile scripts/apply_dudu7_13710_fm_favourites_stereo_af.py
          git diff --check

          grep -q 'versionCode = 169' app/build.gradle.kts
          grep -q 'versionName = "13.7.10"' app/build.gradle.kts

          # Preserve all existing Dudu7/WebRadio/HLS/logo architecture.
          grep -q 'rememberReorderableLazyListState' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VehicleTabOrderStore.persist' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VEHICLE_PHYSICAL_RADIO_ROUTE' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'HlsRecognitionDecoder.decode' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          grep -q 'FLAG_IGNORE_CACHE_FOR_UNSET_LENGTH_REQUESTS' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'builder.setCustomCacheKey(mediaId)' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'RadioDnsLogoResolver.resolveFm' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmStationArtwork.kt
          grep -q 'RADIO_AT("radio.at"' app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoSearch.kt
          grep -q 'suspend fun cachePreview' app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoCache.kt

          # FYT native state comes from actual tuner methods; unknown is not Mono.
          grep -q 'public native boolean stereoMono()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'public native int readRssi()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'public native short getPI()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'public native short\[\] getAFList()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'public int getStereoState()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'return -1;' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'val stereo: Boolean? = null' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'state.stereo?.let' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          grep -q 'state.stereo?.let' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt

          # PI/AF station groups replace frequency-only favorites.
          grep -q 'val alternativeFrequencies: List<Float>' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'private fun groupScanResults' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'private fun mergePresets' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'fun presetMatches' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'preset_order_v2' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt
          grep -q 'snapshot.pi > 0' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'AF_POLL_INTERVAL_MS' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          ! grep -q 'snapshot.rssi in 1..29' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'fm.activeAf()' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'if (pi > 0) return "pi_' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmStationArtwork.kt

          # Favorite long press edits; fake mute and player ±0.1 controls are gone.
          grep -q 'private fun FmPresetEditorDialog' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          grep -q 'onLongClick = onEdit' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          grep -q 'radio.updatePreset' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'onLongClick = onPlay' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'radio.toggleMute()' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'radio.toggleMute()' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          ! grep -q '−0,1' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          ! grep -q '+0,1' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          grep -q 'radio.powerOff()' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          trap - EXIT

      - name: Commit applied source changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              app/build.gradle.kts \
              app/src/dudu7/java/com/android/fmradio/FmNative.java \
              app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt \
              app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt \
              app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmStationArtwork.kt \
              app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
            git commit -m 'fix(dudu7): edit FM favorites and correct stereo grouping AF [skip ci]'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace > build-output.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p _assistant
            grep -E '(^e: | error: |Compilation error|FAILURE:)' build-output.log | tail -n 400 > _assistant/dudu7-13710-build-errors.txt || true
            if [ ! -s _assistant/dudu7-13710-build-errors.txt ]; then
              tail -n 400 build-output.log > _assistant/dudu7-13710-build-errors.txt
            fi
            cat _assistant/dudu7-13710-build-errors.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add _assistant/dudu7-13710-build-errors.txt
            git commit -m 'diag(dudu7): capture 13.7.10 compiler errors [skip ci]' || true
            git push origin HEAD:${GITHUB_HEAD_REF} || true
            exit "$status"
          fi
          cat build-output.log

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='169'" dist/apk-badging.txt
          unzip -l dist/MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum dist/MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF.apk > dist/MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MetroList-Dudu7-13.7.10-FM-Favorites-Stereo-AF
          path: dist/*
          if-no-files-found: error
          retention-days: 14
