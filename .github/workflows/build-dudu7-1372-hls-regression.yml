name: Build Dudu7 13.7.4 Radio Resolver Fix

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and verify thread-safe radio resolver fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_1374_resolver_fix.py
          git diff --check

          # Full Dudu7 feature baseline remains present.
          grep -q 'versionCode = 163' app/build.gradle.kts
          grep -q 'versionName = "13.7.4"' app/build.gradle.kts
          grep -q 'rememberReorderableLazyListState' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VehicleTabOrderStore.persist' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VEHICLE_PHYSICAL_RADIO_ROUTE' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt

          # Existing MP3/AAC path and additive HLS support both remain.
          grep -q 'media3-exoplayer-hls' gradle/libs.versions.toml
          grep -q 'if (!playbackUrl.isHlsStreamUrl())' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'builder.setCustomCacheKey(mediaId)' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'if (dataSpec.key == null)' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'val mediaId = dataSpec.key ?: error("No media id")' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          ! grep -q 'val activeHlsRadioId =' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt

          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt').read_text()
          start = text.index('private fun createDataSourceFactory')
          end = text.index('private fun createMediaSourceFactory', start)
          resolver = text[start:end]
          for forbidden in ('player.currentMediaItem', 'player.currentMediaItemIndex', 'activeHlsRadioId'):
              assert forbidden not in resolver, forbidden
          print('Resolver contains no ExoPlayer state access')
          PY

      - name: Commit applied source fix
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              app/build.gradle.kts \
              app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
            git commit -m 'fix(dudu7): keep radio resolver off player thread [skip ci]'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/MetroList-Dudu7-13.7.4-Radio-Resolver-Fix.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/MetroList-Dudu7-13.7.4-Radio-Resolver-Fix.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/MetroList-Dudu7-13.7.4-Radio-Resolver-Fix.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='163'" dist/apk-badging.txt
          unzip -l dist/MetroList-Dudu7-13.7.4-Radio-Resolver-Fix.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum dist/MetroList-Dudu7-13.7.4-Radio-Resolver-Fix.apk > dist/MetroList-Dudu7-13.7.4-Radio-Resolver-Fix.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MetroList-Dudu7-13.7.4-Radio-Resolver-Fix
          path: dist/*
          if-no-files-found: error
          retention-days: 14
