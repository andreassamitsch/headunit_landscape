name: Build Metrolist dudu7 13.7.13

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and verify 13.7.13 title search correction
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          replacements = {
              'versionCode = 171': 'versionCode = 172',
              'versionName = "13.7.12"': 'versionName = "13.7.13"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Missing build.gradle insertion point: {old}')

          if 'appNameOverride ?: "Metrolist dudu7"' not in text:
              raise SystemExit('Metrolist dudu7 app label was lost')
          if 'resValue("string", "app_name", "Metrolist dudu7")' not in text:
              raise SystemExit('Metrolist dudu7 debug label was lost')
          if 'UPDATER_AVAILABLE", "true"' in text:
              raise SystemExit('Original Metrolist updater was re-enabled')
          build.write_text(text)

          player = Path('app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt')
          player_text = player.read_text()
          old = '''                                        } else {
                                              val albumId = currentMediaMetadata.album?.id
                                                  ?: currentSong?.album?.id
                                                  ?: currentSong?.song?.albumId
                                              albumId?.let { "album/$it" }
                                                  ?: SearchRoutes.resultRoute(
                                                      "${currentMediaMetadata.artists.joinToString(" ") { it.name }} ${currentMediaMetadata.title}".trim(),
                                                  )
                                          }'''
          new = '''                                        } else {
                                              SearchRoutes.resultRoute(
                                                  "${currentMediaMetadata.artists.joinToString(" ") { it.name }} ${currentMediaMetadata.title}".trim(),
                                              )
                                          }'''
          if old in player_text:
              player_text = player_text.replace(old, new, 1)
          elif new not in player_text:
              raise SystemExit('YouTube Music title click insertion point not found')

          title_click_start = player_text.index('                                onTitleClick = {')
          title_click_end = player_text.index('                                onArtistClick = {', title_click_start)
          title_click = player_text[title_click_start:title_click_end]
          if 'val albumId = currentMediaMetadata.album?.id' in title_click:
              raise SystemExit('YouTube Music title click still opens an album')
          expected_query = '"${currentMediaMetadata.artists.joinToString(" ") { it.name }} ${currentMediaMetadata.title}".trim()'
          if expected_query not in title_click:
              raise SystemExit('Current artist and title search query is missing')
          if 'playerConnection.requestRightPaneNavigation(route)' not in title_click:
              raise SystemExit('Right-pane search navigation is missing')
          player.write_text(player_text)
          PY
          git diff --check

          grep -q 'versionCode = 172' app/build.gradle.kts
          grep -q 'versionName = "13.7.13"' app/build.gradle.kts
          grep -q 'appNameOverride ?: "Metrolist dudu7"' app/build.gradle.kts
          grep -q 'resValue("string", "app_name", "Metrolist dudu7")' app/build.gradle.kts
          ! grep -q 'UPDATER_AVAILABLE", "true"' app/build.gradle.kts

          # Preserve the complete latest FM/WebRadio/HLS/logo/fingerprint baseline.
          grep -q 'duplicate station identities never reach' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt
          grep -q 'public int getStereoState()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'public native short\[\] getAFList()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'private fun groupScanResults' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'private fun mergePresets' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'fm.activeAf()' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'private fun FmPresetEditorDialog' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          grep -q 'onLongClick = onEdit' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'radio.toggleMute()' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'radio.toggleMute()' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          grep -q 'HlsRecognitionDecoder.decode' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          grep -q 'FLAG_IGNORE_CACHE_FOR_UNSET_LENGTH_REQUESTS' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'builder.setCustomCacheKey(mediaId)' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'RadioDnsLogoResolver.resolveFm' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmStationArtwork.kt
          grep -q 'radioAtStationImageUrl' app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoSearch.kt
          grep -q 'isStationFragment' app/src/main/kotlin/com/metrolist/music/radio/RadioTrackMetadata.kt
          grep -q 'rememberReorderableLazyListState' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt

      - name: Commit title search and version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle.kts app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
            git commit -m 'fix(dudu7): search current song when title is clicked [skip ci]'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/Metrolist-dudu7-13.7.13.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/Metrolist-dudu7-13.7.13.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/Metrolist-dudu7-13.7.13.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='172'" dist/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" dist/apk-badging.txt
          unzip -l dist/Metrolist-dudu7-13.7.13.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum dist/Metrolist-dudu7-13.7.13.apk > dist/Metrolist-dudu7-13.7.13.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.13
          path: dist/*
          if-no-files-found: error
          retention-days: 14
