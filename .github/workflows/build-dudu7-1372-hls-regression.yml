name: Build Dudu7 13.7.5 Logo HLS Recognition

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and verify focused 13.7.5 fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_1375_logo_hls_recognition.py
          git diff --check

          grep -q 'versionCode = 164' app/build.gradle.kts
          grep -q 'versionName = "13.7.5"' app/build.gradle.kts

          # Existing Dudu7 architecture and ordinary WebRadio playback remain unchanged.
          grep -q 'rememberReorderableLazyListState' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VehicleTabOrderStore.persist' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VEHICLE_PHYSICAL_RADIO_ROUTE' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'if (!playbackUrl.isHlsStreamUrl())' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'builder.setCustomCacheKey(mediaId)' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'if (dataSpec.key == null)' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'val mediaId = dataSpec.key ?: error("No media id")' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt

          # Editor logo controls are visible, scrollable and persist local artwork.
          grep -q '.verticalScroll(scrollState)' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'Text("Bild auswählen")' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'rememberLauncherForActivityResult' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'object RadioStationLogoCache' app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoCache.kt
          grep -q 'withStoredRadioArtwork' app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt

          # HLS fingerprinting uses a separate muted audio-only Media3 decoder.
          grep -q 'TeeAudioProcessor' app/src/main/kotlin/com/metrolist/music/recognition/HlsRecognitionDecoder.kt
          grep -q 'setTrackTypeDisabled(C.TRACK_TYPE_VIDEO, true)' app/src/main/kotlin/com/metrolist/music/recognition/HlsRecognitionDecoder.kt
          grep -q 'player.volume = 0f' app/src/main/kotlin/com/metrolist/music/recognition/HlsRecognitionDecoder.kt
          grep -q 'HlsRecognitionDecoder.decode' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          grep -q 'decodeRadioStream(streamUrl)' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          grep -q 'currentMediaItem?.localConfiguration?.uri' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt

      - name: Commit applied source fixes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              app/build.gradle.kts \
              app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoCache.kt \
              app/src/main/kotlin/com/metrolist/music/radio/RadioStationLogoResolver.kt \
              app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
              app/src/main/kotlin/com/metrolist/music/recognition/HlsRecognitionDecoder.kt \
              app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt \
              app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt \
              app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
            git commit -m 'fix(dudu7): expose fixed logos and decode HLS recognition [skip ci]'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/MetroList-Dudu7-13.7.5-Logo-HLS-Recognition.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/MetroList-Dudu7-13.7.5-Logo-HLS-Recognition.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/MetroList-Dudu7-13.7.5-Logo-HLS-Recognition.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='164'" dist/apk-badging.txt
          unzip -l dist/MetroList-Dudu7-13.7.5-Logo-HLS-Recognition.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum dist/MetroList-Dudu7-13.7.5-Logo-HLS-Recognition.apk > dist/MetroList-Dudu7-13.7.5-Logo-HLS-Recognition.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MetroList-Dudu7-13.7.5-Logo-HLS-Recognition
          path: dist/*
          if-no-files-found: error
          retention-days: 14
