name: Build Dudu7 13.7.2 HLS Regression

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and verify focused patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_1372_hls_final.py
          git diff --check
          grep -q 'versionCode = 161' app/build.gradle.kts
          grep -q 'versionName = "13.7.2"' app/build.gradle.kts
          grep -q 'rememberReorderableLazyListState' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VehicleTabOrderStore.persist' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'VEHICLE_PHYSICAL_RADIO_ROUTE' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'media3-exoplayer-hls' gradle/libs.versions.toml
          grep -q 'qxa/manifest.m3u8' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'player.currentMediaItem?.mediaId?.takeIf { isRadioMediaId(it) }' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/MetroList-Dudu7-13.7.2-Regression-HLS-Fix.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/MetroList-Dudu7-13.7.2-Regression-HLS-Fix.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/MetroList-Dudu7-13.7.2-Regression-HLS-Fix.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='161'" dist/apk-badging.txt
          unzip -l dist/MetroList-Dudu7-13.7.2-Regression-HLS-Fix.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum dist/MetroList-Dudu7-13.7.2-Regression-HLS-Fix.apk > dist/MetroList-Dudu7-13.7.2-Regression-HLS-Fix.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MetroList-Dudu7-13.7.2-Regression-HLS-Fix
          path: dist/*
          if-no-files-found: error
          retention-days: 14
