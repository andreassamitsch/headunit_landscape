name: Build Metrolist dudu7 13.7.12

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and verify 13.7.12 correction
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()

          replacements = {
              'versionCode = 170': 'versionCode = 171',
              'versionName = "13.7.11"': 'versionName = "13.7.12"',
              'resValue("string", "app_name", appNameOverride ?: "Metrolist")':
                  'resValue("string", "app_name", appNameOverride ?: "Metrolist dudu7")',
              'resValue("string", "app_name", "Metrolist Debug")':
                  'resValue("string", "app_name", "Metrolist dudu7")',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Missing build.gradle insertion point: {old}')

          updater_true = 'buildConfigField("Boolean", "UPDATER_AVAILABLE", "true")'
          updater_false = 'buildConfigField("Boolean", "UPDATER_AVAILABLE", "false")'
          if updater_true in text:
              text = text.replace(updater_true, updater_false)
          if updater_true in text or updater_false not in text:
              raise SystemExit('Could not disable the original Metrolist updater')

          build.write_text(text)
          PY
          git diff --check

          grep -q 'versionCode = 171' app/build.gradle.kts
          grep -q 'versionName = "13.7.12"' app/build.gradle.kts
          grep -q 'appNameOverride ?: "Metrolist dudu7"' app/build.gradle.kts
          grep -q 'resValue("string", "app_name", "Metrolist dudu7")' app/build.gradle.kts
          ! grep -q 'UPDATER_AVAILABLE", "true"' app/build.gradle.kts

          # Duplicate PI/name/frequency identities must be collapsed before Compose uses them as keys.
          grep -q 'presets.forEach { preset ->' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt
          grep -q 'ordered.none { existing -> samePreset(existing, preset) }' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt
          grep -q 'val uniquePresets = mutableListOf' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt

          # Preserve the complete FM/WebRadio/HLS/logo implementation.
          grep -q 'public int getStereoState()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'public native short\[\] getAFList()' app/src/dudu7/java/com/android/fmradio/FmNative.java
          grep -q 'private fun groupScanResults' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'private fun mergePresets' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'fm.activeAf()' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'private fun FmPresetEditorDialog' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          grep -q 'onLongClick = onEdit' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q "\.split(';', ',')" app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          grep -q "\.split(';', '\\\\n')" app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'radio.toggleMute()' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          ! grep -q 'radio.toggleMute()' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          ! grep -q '−0,1' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          ! grep -q '+0,1' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          grep -q 'HlsRecognitionDecoder.decode' app/src/main/kotlin/com/metrolist/music/recognition/MusicRecognitionService.kt
          grep -q 'FLAG_IGNORE_CACHE_FOR_UNSET_LENGTH_REQUESTS' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'builder.setCustomCacheKey(mediaId)' app/src/main/kotlin/com/metrolist/music/radio/RadioStation.kt
          grep -q 'RadioDnsLogoResolver.resolveFm' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmStationArtwork.kt
          grep -q 'rememberReorderableLazyListState' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt

      - name: Commit version and Dudu7 identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Source already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle.kts
            git commit -m 'build(dudu7): set 13.7.12 app identity and disable updater [skip ci]'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/Metrolist-dudu7-13.7.12.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/Metrolist-dudu7-13.7.12.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/Metrolist-dudu7-13.7.12.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='171'" dist/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" dist/apk-badging.txt
          unzip -l dist/Metrolist-dudu7-13.7.12.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/'
          sha256sum dist/Metrolist-dudu7-13.7.12.apk > dist/Metrolist-dudu7-13.7.12.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.12
          path: dist/*
          if-no-files-found: error
          retention-days: 14
