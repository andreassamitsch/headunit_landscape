name: Build Dudu7 13.7.60 Radio UI

on:
  pull_request:
    branches: [agent/issue-109-fm-player-adaptive-colors]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"

      - name: Apply issues 111-116
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionCode = 1370069' app/build.gradle.kts; then
            echo 'Issues #111-#116 product patch already applied.'
          else
            python3 scripts/apply_issues_111_116.py
          fi
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/build.gradle.kts \
              app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt \
              app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt \
              app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt \
              app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
              app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt \
              app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
            git commit -m "Unify Dudu7 FM and WebRadio UI and artwork [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          FM_PLAYER=app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          FM_SCREEN=app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          WEB=app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          THUMB=app/src/main/kotlin/com/metrolist/music/ui/player/Thumbnail.kt
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          SETTINGS=app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt
          PREFS=app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt

          grep -q 'versionCode = 1370069' app/build.gradle.kts
          grep -q 'versionName = "13.7.60"' app/build.gradle.kts

          grep -q '●  FM LIVE' "$FM_PLAYER"
          ! grep -q 'RSSI' "$FM_PLAYER"
          grep -q 'if (resolvedSong != null && playerConnection != null)' "$FM_PLAYER"
          grep -q 'size = 52.dp' "$FM_PLAYER"

          grep -q 'onDoubleClick = onNextAf' "$FM_SCREEN"
          grep -q 'Alternative Frequenz wird geprüft' "$FM_SCREEN"
          grep -q 'DropdownMenu(' "$FM_SCREEN"
          grep -q 'R.drawable.more_vert' "$FM_SCREEN"
          ! grep -q 'onLongClick = onEdit' "$FM_SCREEN"

          grep -q 'DropdownMenu(' "$WEB"
          grep -q 'R.drawable.more_vert' "$WEB"
          ! grep -q 'onLongClick = { actionStation' "$WEB"

          grep -q 'fallbackArtworkUri' "$THUMB"
          grep -q 'showStationLogoOverlay' "$THUMB"
          grep -q 'effectiveArtworkFallbackUrl' "$PLAYER"

          grep -q 'Dudu7BackgroundBlurStrengthKey' "$PREFS"
          grep -q 'Dudu7-Hintergrund-Unschärfe' "$SETTINGS"
          grep -q 'artworkBackgroundBlur' "$PLAYER"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.60.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.60.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.60.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370069'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.60.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.60.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.60.apk > artifacts/Metrolist-dudu7-13.7.60.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.60-apk
          path: |
            artifacts/Metrolist-dudu7-13.7.60.apk
            artifacts/Metrolist-dudu7-13.7.60.apk.sha256
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
          retention-days: 14
