name: Dudu7 WebRadio single favorite

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-webradio-single-favorite.yml

permissions:
  contents: write

concurrency:
  group: dudu7-webradio-single-favorite
  cancel-in-progress: true

jobs:
  targeted-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      METROLIST_APPLICATION_ID: com.metrolist.music
      METROLIST_APP_NAME: Metrolist Dudu7
      METROLIST_DEBUG_KEYSTORE_PATH: keystore/dudu7-debug.keystore
      METROLIST_DEBUG_KEYSTORE_PASSWORD: android
      METROLIST_DEBUG_KEY_ALIAS: androiddebugkey
      METROLIST_DEBUG_KEY_PASSWORD: android
      PACKAGE_NAME: com.metrolist.music.dudu7
      ACTIVITY_NAME: com.metrolist.music.MainActivity
      RESULTS_DIR: ui-test-results-single-favorite
      APK_PATH: dist/Metrolist-Dudu7-WebRadio-Single-Favorite-x86.apk
      ANDROID_AVD_HOME: /mnt/android-avd-single-favorite
      API_LEVEL: 34
      SYSTEM_TARGET: google_atd
      DATA_PARTITION_SIZE: 1536M
      DUDU_WIDTH: 1280
      DUDU_HEIGHT: 720
      DUDU_DENSITY: 200

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          fetch-depth: 0
          submodules: recursive

      - name: Apply single-stream favorite architecture
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block missing in {path}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          root = Path('.')

          queue = root / 'app/src/main/kotlin/com/metrolist/music/radio/RadioFavoriteQueue.kt'
          text = queue.read_text(encoding='utf-8')
          helper = '''

          /** Return the adjacent saved station without handing the full list to ExoPlayer. */
          internal fun radioFavoriteNeighbor(
              ordered: List<RadioStation>,
              currentMediaId: String?,
              direction: Int,
          ): RadioStation? {
              if (direction != -1 && direction != 1) return null
              val currentIndex = ordered.indexOfFirst { it.mediaId == currentMediaId }
              if (currentIndex < 0) return null
              return ordered.getOrNull(currentIndex + direction)
          }
          '''.strip('\n') + '\n'
          if 'internal fun radioFavoriteNeighbor(' not in text:
              queue.write_text(text.rstrip() + '\n\n' + helper, encoding='utf-8')

          web = root / 'app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt'
          replace_once(web, 'import com.metrolist.music.radio.replaceFavoriteStation\n', '')
          replace_once(
              web,
              '''        fun startFavorite(playable: RadioStation) {
              val orderedSnapshot = orderedSavedStations.toList().ifEmpty { savedStations }
              val effectiveStations = replaceFavoriteStation(orderedSnapshot, playable)
              val startIndex = effectiveStations.indexOfFirst { it.uuid == playable.uuid }.coerceAtLeast(0)
              playerConnection.playQueue(
                  queue =
                      ListQueue(
                          title = "WebRadio",
                          items = effectiveStations.map { it.toMediaItem() },
                          startIndex = startIndex,
                      ),
                  notifyUserSelection = false,
              )
          }
          ''',
              '''        fun startFavorite(playable: RadioStation) {
              playerConnection.playQueue(
                  queue =
                      ListQueue(
                          title = playable.name,
                          items = listOf(playable.toMediaItem()),
                      ),
                  notifyUserSelection = false,
              )
          }
          ''',
          )

          player = root / 'app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt'
          replace_once(
              player,
              'import com.metrolist.music.playback.queues.Queue\n',
              'import com.metrolist.music.playback.queues.ListQueue\nimport com.metrolist.music.playback.queues.Queue\n',
          )
          replace_once(
              player,
              'import com.metrolist.music.radio.isRadioMediaId\n',
              'import com.metrolist.music.radio.RadioStationStore\nimport com.metrolist.music.radio.isRadioMediaId\nimport com.metrolist.music.radio.radioFavoriteNeighbor\n',
          )
          replace_once(
              player,
              '''    val service = binder.service
              private val playerReadinessFlow = service.isPlayerReady
          ''',
              '''    val service = binder.service
              private val radioStationStore = RadioStationStore.get(context.applicationContext)
              private val playerReadinessFlow = service.isPlayerReady
          ''',
          )
          replace_once(
              player,
              '''        scope.launch {
              playerReadinessFlow.collect { ready ->
                  isPlayerInitialized.value = ready
                  if (ready) {
                      Timber.tag(TAG).d("Service player initialization detected by PlayerConnection")
                  }
              }
          }

          Timber.tag(TAG).d("PlayerConnection state flows initialized successfully")
          ''',
              '''        scope.launch {
              playerReadinessFlow.collect { ready ->
                  isPlayerInitialized.value = ready
                  if (ready) {
                      Timber.tag(TAG).d("Service player initialization detected by PlayerConnection")
                  }
              }
          }
          scope.launch {
              radioStationStore.stations.collect {
                  if (isRadioMediaId(getPlayerOrNull()?.currentMediaItem?.mediaId)) {
                      updateCanSkipPreviousAndNext()
                  }
              }
          }

          Timber.tag(TAG).d("PlayerConnection state flows initialized successfully")
          ''',
          )
          replace_once(
              player,
              '''    fun seekToNext() {
              try {
                  // When casting, use Cast skip instead of local player
          ''',
              '''    private fun playAdjacentRadioFavorite(direction: Int): Boolean {
              val activePlayer = getPlayerOrNull() ?: return false
              val currentMediaId = activePlayer.currentMediaItem?.mediaId
              if (!isRadioMediaId(currentMediaId)) return false
              val target =
                  radioFavoriteNeighbor(
                      ordered = radioStationStore.stations.value,
                      currentMediaId = currentMediaId,
                      direction = direction,
                  ) ?: return false
              playQueue(
                  queue = ListQueue(title = target.name, items = listOf(target.toMediaItem())),
                  notifyUserSelection = false,
              )
              return true
          }

          fun seekToNext() {
              try {
                  // When casting, use Cast skip instead of local player
          ''',
          )
          replace_once(
              player,
              '''            player.seekToNext()
              if (player.playbackState == Player.STATE_IDLE || player.playbackState == Player.STATE_ENDED) {
          ''',
              '''            if (isRadioMediaId(player.currentMediaItem?.mediaId)) {
                  if (playAdjacentRadioFavorite(1)) onSkipNext?.invoke()
                  return
              }
              player.seekToNext()
              if (player.playbackState == Player.STATE_IDLE || player.playbackState == Player.STATE_ENDED) {
          ''',
          )
          replace_once(
              player,
              '''            // A live radio stream has no meaningful "restart current item" position.
              // Previous must always select the previous saved station.
              if (isRadioMediaId(player.currentMediaItem?.mediaId) && player.hasPreviousMediaItem()) {
                  player.seekToPreviousMediaItem()
                  if (player.playbackState == Player.STATE_IDLE || player.playbackState == Player.STATE_ENDED) {
                      player.prepare()
                  }
                  player.playWhenReady = true
                  onSkipPrevious?.invoke()
                  return
              }

              // Logic to mimic standard seekToPrevious behavior but with explicit callbacks
          ''',
              '''            // A live radio stream has no seek position. Resolve the previous
              // saved favorite ourselves and keep ExoPlayer on a single stream.
              if (isRadioMediaId(player.currentMediaItem?.mediaId)) {
                  if (playAdjacentRadioFavorite(-1)) onSkipPrevious?.invoke()
                  return
              }

              // Logic to mimic standard seekToPrevious behavior but with explicit callbacks
          ''',
          )
          replace_once(
              player,
              '''    private fun updateCanSkipPreviousAndNext() {
              if (!player.currentTimeline.isEmpty) {
          ''',
              '''    private fun updateCanSkipPreviousAndNext() {
              val currentMediaId = player.currentMediaItem?.mediaId
              if (isRadioMediaId(currentMediaId)) {
                  val favorites = radioStationStore.stations.value
                  canSkipPrevious.value = radioFavoriteNeighbor(favorites, currentMediaId, -1) != null
                  canSkipNext.value = radioFavoriteNeighbor(favorites, currentMediaId, 1) != null
                  return
              }
              if (!player.currentTimeline.isEmpty) {
          ''',
          )

          gradle = root / 'app/build.gradle.kts'
          replace_once(gradle, '        versionCode = 160\n        versionName = "13.7.1"\n', '        versionCode = 161\n        versionName = "13.7.2"\n')

          test = root / 'app/src/test/kotlin/com/metrolist/music/radio/RadioFavoriteNavigationTest.kt'
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package com.metrolist.music.radio

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          class RadioFavoriteNavigationTest {
              private val stations =
                  listOf(
                      RadioStation("broken-before", "Broken Before", "http://invalid/before"),
                      RadioStation("one", "Favorite One", "http://valid/one"),
                      RadioStation("two", "Favorite Two", "http://valid/two"),
                      RadioStation("broken-after", "Broken After", "http://invalid/after"),
                  )

              @Test
              fun nextAndPreviousUsePersistedOrder() {
                  assertEquals("two", radioFavoriteNeighbor(stations, stations[1].mediaId, 1)?.uuid)
                  assertEquals("one", radioFavoriteNeighbor(stations, stations[2].mediaId, -1)?.uuid)
              }

              @Test
              fun navigationStopsAtOrderEdges() {
                  assertNull(radioFavoriteNeighbor(stations, stations.first().mediaId, -1))
                  assertNull(radioFavoriteNeighbor(stations, stations.last().mediaId, 1))
              }

              @Test
              fun unknownOrInvalidDirectionDoesNothing() {
                  assertNull(radioFavoriteNeighbor(stations, "radio:missing", 1))
                  assertNull(radioFavoriteNeighbor(stations, stations[1].mediaId, 0))
              }
          }
          '''.replace('          ', ''), encoding='utf-8')
          PY
          git diff --check
          grep -q 'items = listOf(playable.toMediaItem())' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          ! grep -q 'effectiveStations.map' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Test only favorite order logic
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --tests com.metrolist.music.radio.RadioFavoriteNavigationTest
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Build signed ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist artifacts
          rm -rf app/build
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-arm.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk
          aapt dump badging dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk | grep "package: name='com.metrolist.music.dudu7' versionCode='161'"
          unzip -l dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk | grep 'lib/arm64-v8a/'
          unzip -l dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk | grep 'lib/armeabi-v7a/'
          apksigner verify --verbose --print-certs dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk | tee artifacts/apksigner.txt
          sha256sum dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk | tee artifacts/apk-sha256.txt
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare focused x86 test APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build.gradle.kts /tmp/build.gradle.production.kts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          if old not in text:
              raise SystemExit('ARM ABI declaration missing')
          path.write_text(text.replace(old, 'abiFilters += listOf("x86_64")', 1), encoding='utf-8')
          PY
          rm -rf app/build
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-x86.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$APK_PATH"
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare two deterministic streams
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p radio-test-data "$RESULTS_DIR"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=24' -c:a libmp3lame -b:a 96k radio-test-data/station1.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=660:duration=24' -c:a libmp3lame -b:a 96k radio-test-data/station2.mp3
          python3 scripts/icy_round3_test_server.py --audio1 radio-test-data/station1.mp3 --audio2 radio-test-data/station2.mp3 > "$RESULTS_DIR/radio-server.log" 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Create focused start-next-previous smoke
        shell: bash
        run: |
          set -euxo pipefail
          cat > scripts/dudu7_ui_smoke.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          PACKAGE_NAME="${PACKAGE_NAME:-com.metrolist.music.dudu7}"
          ACTIVITY_NAME="${ACTIVITY_NAME:-com.metrolist.music.MainActivity}"
          APK_PATH="${APK_PATH:?APK_PATH required}"
          RESULTS_DIR="${RESULTS_DIR:-ui-test-results-single-favorite}"
          DUDU_WIDTH="${DUDU_WIDTH:-1280}"
          DUDU_HEIGHT="${DUDU_HEIGHT:-720}"
          DUDU_DENSITY="${DUDU_DENSITY:-200}"
          mkdir -p "$RESULTS_DIR"
          exec > >(tee "$RESULTS_DIR/smoke.log") 2>&1

          capture() { adb exec-out screencap -p > "$RESULTS_DIR/$1.png" || true; }
          dump_ui() {
            for attempt in 1 2 3; do
              timeout 15s adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml "$RESULTS_DIR/window.xml" >/dev/null 2>&1 || true
              test -s "$RESULTS_DIR/window.xml" && return 0
              sleep 2
            done
            return 1
          }
          coords() {
            local right="$1"; shift
            dump_ui
            python3 - "$RESULTS_DIR/window.xml" "$DUDU_WIDTH" "$right" "$@" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          path,width,right,*needles=sys.argv[1:]; width=int(width)
          root=ET.parse(path).getroot(); parent={c:n for n in root.iter() for c in n}
          exact=[x[1:].casefold() for x in needles if x.startswith('=')]
          partial=[x.casefold() for x in needles if not x.startswith('=')]
          for node in root.iter('node'):
              vals=[node.attrib.get('text','').strip().casefold(),node.attrib.get('content-desc','').strip().casefold()]
              hay=' '.join(v for v in vals if v)
              if not (any(v==n for v in vals for n in exact) or any(n in hay for n in partial)): continue
              cur=node; fallback=None
              while cur is not None:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',cur.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      if (right!='1' or l>=width//2) and r>l and b>t:
                          fallback=(l,t,r,b)
                          if cur.attrib.get('clickable')=='true': print((l+r)//2,(t+b)//2); raise SystemExit(0)
                  cur=parent.get(cur)
              if fallback:
                  l,t,r,b=fallback; print((l+r)//2,(t+b)//2); raise SystemExit(0)
          raise SystemExit(1)
          PY
          }
          tap() { local label="$1" right="$2"; shift 2; local p; p=$(coords "$right" "$@"); echo "Tap $label: $p"; adb shell input tap $p; sleep 3; }
          assert_ui() { local label="$1" right="$2"; shift 2; for i in 1 2 3 4 5; do coords "$right" "$@" >/dev/null && { echo "PASS: $label"; return; }; sleep 2; done; capture "fail-${label// /-}"; return 1; }

          python3 - > /tmp/metrolist_webradio.xml <<'PY'
          import html,json
          stations=[
            {"uuid":"broken-before","name":"Broken Before","streamUrl":"http://10.0.2.2:8000/always-broken","homepage":"","favicon":"","manualFavicon":False,"country":"","language":"","tags":"","codec":"","bitrate":0},
            {"uuid":"one","name":"Favorite One","streamUrl":"http://10.0.2.2:8000/station1","homepage":"","favicon":"","manualFavicon":False,"country":"","language":"","tags":"","codec":"","bitrate":0},
            {"uuid":"two","name":"Favorite Two","streamUrl":"http://10.0.2.2:8000/station2","homepage":"","favicon":"","manualFavicon":False,"country":"","language":"","tags":"","codec":"","bitrate":0},
            {"uuid":"broken-after","name":"Broken After","streamUrl":"http://10.0.2.2:8000/always-broken","homepage":"","favicon":"","manualFavicon":False,"country":"","language":"","tags":"","codec":"","bitrate":0}
          ]
          raw=json.dumps(stations,separators=(',',':'))
          print('<?xml version="1.0" encoding="utf-8" standalone="yes" ?>')
          print('<map><string name="stations">'+html.escape(raw)+'</string></map>')
          PY

          adb wait-for-device
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell wm size "${DUDU_WIDTH}x${DUDU_HEIGHT}" || true
          adb shell wm density "$DUDU_DENSITY" || true
          adb install -r -g "$APK_PATH"
          adb push /tmp/metrolist_webradio.xml /data/local/tmp/metrolist_webradio.xml >/dev/null
          adb shell run-as "$PACKAGE_NAME" mkdir -p shared_prefs
          adb shell run-as "$PACKAGE_NAME" cp /data/local/tmp/metrolist_webradio.xml shared_prefs/metrolist_webradio.xml
          adb logcat -c
          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start -W -n "$PACKAGE_NAME/$ACTIVITY_NAME"
          sleep 12
          capture launch

          tap "WebRadio" 0 "=WebRadio"
          assert_ui "favorites visible" 1 "=Favorite One"
          tap "Favorite One" 1 "=Favorite One"
          assert_ui "single favorite starts" 0 "=Never Gonna Give You Up"
          tap "Next favorite" 0 "=Nächster Titel"
          assert_ui "next favorite plays" 0 "=Test Track Two"
          tap "Previous favorite" 0 "=Vorheriger Titel"
          assert_ui "previous favorite plays" 0 "=Never Gonna Give You Up"

          adb logcat -d -v threadtime > "$RESULTS_DIR/logcat.txt" || true
          ! grep -E "FATAL EXCEPTION|ANR in ${PACKAGE_NAME}" "$RESULTS_DIR/logcat.txt"
          ! grep -q 'GET /always-broken' "$RESULTS_DIR/radio-server.log"
          capture final
          echo 'PASS: single favorite start, next and previous'
          SH
          chmod +x scripts/dudu7_ui_smoke.sh scripts/run_dudu7_emulator_ci.sh

      - name: Reclaim space and run only focused emulator test
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL /usr/share/dotnet || true
          sudo rm -rf "$ANDROID_AVD_HOME"
          sudo mkdir -p "$ANDROID_AVD_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          scripts/run_dudu7_emulator_ci.sh
          grep -q 'PASS: single favorite start, next and previous' "$RESULTS_DIR/smoke.log"

      - name: Restore production ABI and commit validated source
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/build.gradle.production.kts app/build.gradle.kts
          rm -f scripts/dudu7_ui_smoke.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts \
            app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt \
            app/src/main/kotlin/com/metrolist/music/radio/RadioFavoriteQueue.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
            app/src/test/kotlin/com/metrolist/music/radio/RadioFavoriteNavigationTest.kt
          git commit -m 'Play WebRadio favorites as single streams [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - name: Upload APK and focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-13.7.2-WebRadio-Favorites-${{ github.run_id }}
          path: |
            dist/Metrolist-Dudu7-13.7.2-WebRadio-Favorites.apk
            artifacts/
            ui-test-results-single-favorite/
          if-no-files-found: warn
          retention-days: 14
