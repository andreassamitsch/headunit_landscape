name: Dudu7 round 3 architecture diagnostic

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-round3-architecture-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          submodules: recursive
          fetch-depth: 0
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          mkdir -p .build-metadata
          {
            python3 scripts/apply_dudu7_webradio_reliability_round3.py
            echo "webradio_patch=$?"
            python3 scripts/apply_dudu7_artist_items_round3.py
            echo "artist_patch=$?"
            python3 scripts/apply_dudu7_fm_recognition_round3.py
            echo "fm_patch=$?"
            python3 scripts/apply_dudu7_architecture_round3.py
            echo "architecture_patch=$?"
            python3 scripts/verify_dudu7_architecture.py
            echo "architecture_verify=$?"
          } > .build-metadata/dudu7-round3-architecture-diagnostic.txt 2>&1
          cat .build-metadata/dudu7-round3-architecture-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .build-metadata/dudu7-round3-architecture-diagnostic.txt
          git commit -m 'Record round 3 architecture diagnostic [skip ci]'
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
