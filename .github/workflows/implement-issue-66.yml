name: Implement Issue 66 Source State

on:
  push:
    branches:
      - agent/issue-66-source-state-restoration

permissions:
  contents: write

jobs:
  implement-test-build:
    if: contains(github.event.head_commit.message, '[build-66]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-66-source-state-restoration
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply issue 66 product changes
        run: python3 .github/scripts/implement-issue-66.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "Metrolist dudu7 13.7.37.apk"
          sha256sum "Metrolist dudu7 13.7.37.apk" | tee "Metrolist dudu7 13.7.37.apk.sha256"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -n 1)"
          "$AAPT" dump badging "Metrolist dudu7 13.7.37.apk" | grep -E "package: name='com.metrolist.music.dudu7.debug'.*versionCode='1370046'.*versionName='13.7.37-dudu7'"
          unzip -l "Metrolist dudu7 13.7.37.apk" | grep 'lib/arm64-v8a/'
          unzip -l "Metrolist dudu7 13.7.37.apk" | grep 'lib/armeabi-v7a/'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "Metrolist dudu7 13.7.37.apk" | grep 'Verified using v2 scheme (APK Signature Scheme v2): true'

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.37
          path: |
            Metrolist dudu7 13.7.37.apk
            Metrolist dudu7 13.7.37.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit tested product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SourcePlaybackCoordinator.kt \
            app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt \
            app/src/test/kotlin/com/metrolist/music/playback/Dudu7SourcePlaybackCoordinatorTest.kt
          git commit -m "Preserve Dudu7 source playback states"
          git push origin HEAD:agent/issue-66-source-state-restoration
