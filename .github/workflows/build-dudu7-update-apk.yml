name: Build Metrolist dudu7 update APK

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dudu7-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3

      - name: Validate final 13.7.27 source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'versionCode = 1370036' app/build.gradle.kts
          grep -q 'versionName = "13.7.27"' app/build.gradle.kts
          grep -q 'appNameOverride ?: "Metrolist dudu7"' app/build.gradle.kts
          grep -q '"9d46652d"' app/src/main/assets/player_configs.json
          grep -q 'startDestination = initialTab.route' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'val lastTrace: StateFlow<Trace>' app/src/main/kotlin/com/metrolist/music/radio/RadioDnsLogoResolver.kt
          grep -q 'cachedIsRadioDns' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/ReliableFmStationLogoResolver.kt
          grep -q 'RadioDNS-Status' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/FmRadioDiagnostics.kt
          grep -q 'onMediaButtonEvent' app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt
          grep -q 'onPlayerCommandRequest' app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt
          grep -q 'PhysicalFmMediaKeyBridge' app/src/main/kotlin/com/metrolist/music/playback/PhysicalFmMediaKeyBridge.kt
          grep -q 'Radio Steiermark' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/RtrPublicProgramName.kt
          if grep -q 'UPDATER_AVAILABLE", "true"' app/build.gradle.kts; then
            echo 'Original Metrolist updater was re-enabled' >&2
            exit 1
          fi

      - name: RadioDNS live protocol probe
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          lookup='10620.c460.ce1.fm.radiodns.org'
          def dns(name, qtype):
              url='https://dns.google/resolve?name='+urllib.parse.quote(name)+'&type='+str(qtype)
              req=urllib.request.Request(url,headers={'Accept':'application/dns-json','User-Agent':'MetrolistHU-CI/13.7.27'})
              with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
              assert data.get('Status') == 0, data
              return [a['data'] for a in data.get('Answer',[]) if a.get('type') == qtype]
          cname=dns(lookup,5)[0].rstrip('.')
          srv=dns('_radioepg._tcp.'+cname,33)[0].split()
          port=int(srv[2]); host=srv[3].rstrip('.')
          url=('https' if port==443 else 'http')+'://'+host+((':'+str(port)) if port not in (80,443) else '')+'/radiodns/spi/3.1/SI.xml'
          req=urllib.request.Request(url,headers={'Accept':'application/xml,text/xml,*/*;q=0.2','User-Agent':'MetrolistHU-CI/13.7.27'})
          with urllib.request.urlopen(req,timeout=20) as r: payload=r.read(3_000_000)
          root=ET.fromstring(payload)
          bearer='fm:ce1.c460.10620'
          matches=[]
          for service in [e for e in root.iter() if e.tag.split('}')[-1]=='service']:
              ids=[e.attrib.get('id','').lower() for e in service.iter() if e.tag.split('}')[-1]=='bearer']
              if bearer in ids:
                  matches=[e.attrib.get('url','') for e in service.iter() if e.tag.split('}')[-1]=='multimedia']
                  break
          assert matches, f'No logos found for {bearer} in {url}'
          print('RadioDNS live probe OK', lookup, cname, url, len(matches))
          PY

      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Build and verify ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          OUT="artifacts/Metrolist-dudu7-${VERSION}.apk"
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370036'" artifacts/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l "$OUT" | tee artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          sha256sum "$OUT" > "$OUT.sha256"
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-update
          path: artifacts/
          retention-days: 14
