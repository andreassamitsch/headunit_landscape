name: Build Metrolist dudu7 update APK

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dudu7-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}
      - name: Apply and persist FM identity hardening
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_13724_fm_identity_hardening.py
          git diff --check
          grep -q 'versionCode = 1370033' app/build.gradle.kts
          grep -q 'versionName = "13.7.24"' app/build.gradle.kts
          grep -q 'rdsConfirmed: Boolean' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'FmRdsFreshness.consolidate' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'FmStationAssociation.sameStation' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          rm scripts/apply_dudu7_13724_fm_identity_hardening.py
          git show origin/agent/fm-radio-ui-logos-tabs:.github/workflows/build-dudu7-update-apk.yml > .github/workflows/build-dudu7-update-apk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(dudu7): harden FM station identity and RDS freshness [skip ci]'
          git push origin HEAD:${GITHUB_HEAD_REF}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3
      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'versionCode = 1370033' app/build.gradle.kts
          grep -q 'versionName = "13.7.24"' app/build.gradle.kts
          grep -q 'appNameOverride ?: "Metrolist dudu7"' app/build.gradle.kts
          grep -q 'FmStationAssociation.sameStation' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          if grep -q 'UPDATER_AVAILABLE", "true"' app/build.gradle.kts; then
            echo 'Original Metrolist updater was re-enabled' >&2
            exit 1
          fi
      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      - name: Build and verify ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          OUT="artifacts/Metrolist-dudu7-13.7.24.apk"
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370033'" artifacts/apk-badging.txt
          grep -q "versionName='13.7.24-dudu7'" artifacts/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l "$OUT" | tee artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          sha256sum "$OUT" > "$OUT.sha256"
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Metrolist-dudu7-13.7.24
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
