name: Build Metrolist dudu7 update APK

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dudu7-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and persist artist album navigation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          artist = Path('app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt')
          text = artist.read_text()

          item_marker = '''                                    ) { item ->
                                        YouTubeGridItem(
'''
          item_replacement = '''                                    ) { item ->
                                        val albumTapKey = "artist_album_${index}_${item.id}"
                                        DisposableEffect(albumTapKey) {
                                            onDispose {
                                                rightPaneTapTargets.remove(albumTapKey)
                                            }
                                        }
                                        YouTubeGridItem(
'''
          if 'val albumTapKey = "artist_album_${index}_${item.id}"' not in text:
              if text.count(item_marker) != 1:
                  raise SystemExit(f'Unexpected artist item marker count: {text.count(item_marker)}')
              text = text.replace(item_marker, item_replacement, 1)

          modifier_marker = '''                                            modifier =
                                                Modifier
                                                    .combinedClickable(
'''
          modifier_replacement = '''                                            modifier =
                                                Modifier
                                                    .onGloballyPositioned { coordinates ->
                                                        if (embeddedInPlayer && item is AlbumItem) {
                                                            val albumId = item.id
                                                            rightPaneTapTargets[albumTapKey] =
                                                                coordinates.boundsInRoot() to {
                                                                    timber.log.Timber.tag("Dudu7ArtistAlbumTap").i(
                                                                        "Opening artist album item id=%s",
                                                                        albumId,
                                                                    )
                                                                    navController.navigate("album/$albumId")
                                                                }
                                                        } else {
                                                            rightPaneTapTargets.remove(albumTapKey)
                                                        }
                                                    }
                                                    .combinedClickable(
'''
          if 'Timber.tag("Dudu7ArtistAlbumTap")' not in text:
              start = text.index('val albumTapKey = "artist_album_${index}_${item.id}"')
              pos = text.find(modifier_marker, start)
              if pos < 0:
                  raise SystemExit('Artist grid modifier marker not found after album tap key')
              text = text[:pos] + modifier_replacement + text[pos + len(modifier_marker):]

          artist.write_text(text)

          build = Path('app/build.gradle.kts')
          build_text = build.read_text()
          replacements = {
              'versionCode = 1370026': 'versionCode = 1370027',
              'versionName = "13.7.17"': 'versionName = "13.7.18"',
          }
          for old, new in replacements.items():
              if old in build_text:
                  build_text = build_text.replace(old, new, 1)
              elif new not in build_text:
                  raise SystemExit(f'Missing version insertion point: {old}')
          build.write_text(build_text)
          PY

          git diff --check
          grep -q 'val albumTapKey = "artist_album_${index}_${item.id}"' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'Dudu7ArtistAlbumTap' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'navController.navigate("album/$albumId")' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'versionCode = 1370027' app/build.gradle.kts
          grep -q 'versionName = "13.7.18"' app/build.gradle.kts

          git checkout origin/agent/fm-radio-ui-logos-tabs -- .github/workflows/build-dudu7-update-apk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt .github/workflows/build-dudu7-update-apk.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(dudu7): open artist albums and singles in right pane [skip ci]'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Dudu7 source configuration
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'appNameOverride ?: "Metrolist dudu7"' app/build.gradle.kts
          grep -q 'resValue("string", "app_name", "Metrolist dudu7")' app/build.gradle.kts
          grep -q 'Dudu7ArtistAlbumTap' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'navController.navigate("album/$albumId")' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          if grep -q 'UPDATER_AVAILABLE", "true"' app/build.gradle.kts; then
            echo 'Original Metrolist updater was re-enabled' >&2
            exit 1
          fi

      - name: Read APK version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify update APK
        shell: bash
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          OUT="dist/Metrolist-dudu7-${VERSION_NAME}.apk"
          cp "$APK" "$OUT"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > dist/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" > dist/apk-signature.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='${VERSION_CODE}'" dist/apk-badging.txt
          grep -q "versionName='${VERSION_NAME}-dudu7'" dist/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" dist/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' dist/apk-signature.txt
          unzip -l "$OUT" | tee dist/apk-contents.txt
          grep -q 'lib/arm64-v8a/' dist/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' dist/apk-contents.txt
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Upload update-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-${{ steps.meta.outputs.version_name }}
          path: |
            dist/Metrolist-dudu7-${{ steps.meta.outputs.version_name }}.apk
            dist/Metrolist-dudu7-${{ steps.meta.outputs.version_name }}.apk.sha256
            dist/apk-badging.txt
            dist/apk-signature.txt
          if-no-files-found: error
          retention-days: 14
