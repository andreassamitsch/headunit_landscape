name: Validate Dudu7 Screens startup crash fix

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-screens-crash-fix.yml

permissions:
  contents: read

concurrency:
  group: dudu7-screens-startup-fix
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      METROLIST_APPLICATION_ID: com.metrolist.music
      METROLIST_APP_NAME: Metrolist
      METROLIST_DEBUG_KEYSTORE_PATH: keystore/dudu7-debug.keystore
      METROLIST_DEBUG_KEYSTORE_PASSWORD: android
      METROLIST_DEBUG_KEY_ALIAS: androiddebugkey
      METROLIST_DEBUG_KEY_PASSWORD: android

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify source fix and Dudu7 certificate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'get() = listOf(Home, Search, ListenTogether, Library)' app/src/main/kotlin/com/metrolist/music/ui/screens/Screens.kt
          grep -q 'assertNotSame(first, second)' app/src/test/kotlin/com/metrolist/music/ui/screens/ScreensInitializationTest.kt
          keytool -list -v -keystore app/keystore/dudu7-debug.keystore -storepass android -alias androiddebugkey \
            | tee certificate.txt
          grep -q 'SHA256: D5:84:2D:91:77:A6:4C:29:45:7C:57:03:9E:EA:DA:D8:13:3A:72:F6:A4:D3:64:98:72:5E:DF:3F:58:B3:B3:77' certificate.txt

      - name: Run targeted regression and Dudu7 unit tests
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --console=plain \
            :app:testGmsDudu7DebugUnitTest \
            --tests com.metrolist.music.ui.screens.ScreensInitializationTest \
            --warning-mode summary

      - name: Build and verify update-compatible ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk | tee artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk | tee artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7' versionCode='160'" artifacts/apk-badging.txt
          grep -q 'Signer #1 certificate SHA-256 digest: d5842d9177a64c29457c57039eeadad8133a72f6a4d36498725edf3f58b3b377' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk | grep 'lib/arm64-v8a/'
          unzip -l artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk | grep 'lib/armeabi-v7a/'
          sha256sum artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-Screens-Crash-Fix-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
