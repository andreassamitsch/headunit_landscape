name: Validate Dudu7 Screens startup crash fix

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-screens-crash-fix.yml

permissions:
  contents: write

concurrency:
  group: dudu7-screens-startup-fix
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      METROLIST_APPLICATION_ID: com.metrolist.music
      METROLIST_APP_NAME: Metrolist
      METROLIST_DEBUG_KEYSTORE_PATH: keystore/dudu7-debug.keystore
      METROLIST_DEBUG_KEYSTORE_PASSWORD: android
      METROLIST_DEBUG_KEY_ALIAS: androiddebugkey
      METROLIST_DEBUG_KEY_PASSWORD: android
      STATUS_FILE: .build-metadata/dudu7-screens-crash-fix-run.txt
      OUTPUT_APK: artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          submodules: recursive
          fetch-depth: 0

      - name: Record running workflow
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build-metadata
          printf 'run_id=%s\nstatus=running\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record Dudu7 Screens crash fix run [skip ci]'
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify source fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          screens = Path('app/src/main/kotlin/com/metrolist/music/ui/screens/Screens.kt').read_text(encoding='utf-8')
          test = Path('app/src/test/kotlin/com/metrolist/music/ui/screens/ScreensInitializationTest.kt').read_text(encoding='utf-8')
          assert 'get() = listOf(Home, Search, ListenTogether, Library)' in screens
          assert 'assertNotSame(first, second)' in test
          PY

      - name: Run targeted regression test
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --console=plain \
            :app:testGmsDudu7DebugUnitTest \
            --tests com.metrolist.music.ui.screens.ScreensInitializationTest \
            --warning-mode summary

      - name: Build update-compatible ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          candidates = [
              path for path in Path('app/build/outputs/apk').rglob('*.apk')
              if 'dudu7' in str(path).lower() and 'debug' in str(path).lower()
          ]
          if not candidates:
              raise SystemExit('No Dudu7 debug APK found')
          candidates.sort(key=lambda path: path.stat().st_mtime, reverse=True)
          output = Path('artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk')
          shutil.copy2(candidates[0], output)
          print(f'Copied {candidates[0]} -> {output}')
          PY

      - name: Verify package, signature and ARM ABIs
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT_APK" > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT_APK" > artifacts/apk-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          import zipfile

          badging = Path('artifacts/apk-badging.txt').read_text(encoding='utf-8', errors='replace')
          match = re.search(r"package: name='([^']+)' versionCode='([^']+)'", badging)
          assert match, badging[:500]
          assert match.group(1) == 'com.metrolist.music.dudu7', match.groups()
          assert match.group(2) == '160', match.groups()

          signature = Path('artifacts/apk-signature.txt').read_text(encoding='utf-8', errors='replace').lower()
          expected = 'd5842d9177a64c29457c57039eeadad8133a72f6a4d36498725edf3f58b3b377'
          assert expected in signature, signature

          with zipfile.ZipFile('artifacts/Metrolist-Dudu7-13.7.1-Screens-Crash-Fix.apk') as archive:
              names = archive.namelist()
          assert any(name.startswith('lib/arm64-v8a/') for name in names)
          assert any(name.startswith('lib/armeabi-v7a/') for name in names)
          PY
          sha256sum "$OUTPUT_APK" | tee artifacts/SHA256SUMS.txt

      - name: Record successful result
        shell: bash
        run: |
          set -euxo pipefail
          APK_SHA="$(cut -d' ' -f1 artifacts/SHA256SUMS.txt)"
          printf 'run_id=%s\nstatus=success\nvalidated_commit=%s\nartifact_name=Metrolist-Dudu7-Screens-Crash-Fix-%s\napk_sha256=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$APK_SHA" > "$STATUS_FILE"
          git add "$STATUS_FILE"
          git commit -m 'Record successful Dudu7 Screens crash fix build [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-Screens-Crash-Fix-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git fetch origin agent/fm-radio-ui-logos-tabs
          git checkout -B agent/fm-radio-ui-logos-tabs origin/agent/fm-radio-ui-logos-tabs
          mkdir -p .build-metadata
          printf 'run_id=%s\nstatus=failure\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record failed Dudu7 Screens crash fix build [skip ci]' || exit 0
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
