name: Validate Metrolist 13.7.2 artist rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1372-artist-fix.yml'

permissions:
  contents: write

concurrency:
  group: metrolist-v1372-artist-render
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      API_LEVEL: '33'
      SYSTEM_TARGET: google_apis
      DATA_PARTITION_SIZE: 1536M
      ANDROID_AVD_HOME: /mnt/android-avd
      DUDU_WIDTH: '1280'
      DUDU_HEIGHT: '720'
      DUDU_DENSITY: '200'
      PACKAGE_NAME: com.metrolist.music.dudu7.debug
      ACTIVITY_NAME: com.metrolist.music.MainActivity
      RESULTS_DIR: ui-test-results
      APK_PATH: dist/Metrolist-Dudu7-13.7.2-emulator.apk

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Record render validation run
        run: |
          set -euxo pipefail
          mkdir -p _assistant
          printf 'run_id=%s\nstatus=running\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > _assistant/v1372_artist_render_run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _assistant/v1372_artist_render_run.txt
          git commit -m 'test(dudu7): record artist render validation [skip ci]'
          git pull --rebase origin main
          git push

      - name: Apply artist render fix and strict test
        run: |
          set -euxo pipefail
          python3 scripts/apply_v1374_artist_render_fix.py
          python3 -m py_compile scripts/apply_v1374_artist_render_fix.py
          bash -n scripts/dudu7_v1371_regression_smoke.sh
          bash -n scripts/run_dudu7_emulator_ci.sh
          git diff --check
          grep -q 'versionCode = 161' app/build.gradle.kts
          grep -q 'versionName = "13.7.2"' app/build.gradle.kts
          grep -q 'lazyListState.scrollBy(delta)' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'rightPaneTapTargets\[playAllTapKey\]' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt
          grep -q 'assert_artist_pixels_not_blank' scripts/dudu7_v1371_regression_smoke.sh
          if grep -q '\.animateItem()' app/src/main/kotlin/com/metrolist/music/ui/screens/artist/ArtistScreen.kt; then
            echo 'Artist item placement animation remains' >&2
            exit 1
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(dudu7): keep artist items rendered while scrolling [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build x86_64 test APK
        run: |
          set -euxo pipefail
          mkdir -p artifacts dist "$RESULTS_DIR"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          if old not in text:
              raise SystemExit('Expected ARM ABI declaration not found')
          path.write_text(text.replace(old, 'abiFilters += listOf("x86_64")', 1), encoding='utf-8')
          PY
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-x86.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$APK_PATH"
          unzip -l "$APK_PATH" | grep 'lib/x86_64/'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare deterministic data and image inspection
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          python3 -c 'from PIL import Image; print(Image.__version__)'
          mkdir -p radio-test-data "$RESULTS_DIR"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station1.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=660:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station2.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=880:duration=18' -c:a libmp3lame -b:a 96k radio-test-data/station3.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=0x4f46e5:s=512x512' -frames:v 1 radio-test-data/logo3.png
          python3 scripts/icy_test_server.py \
            --audio1 radio-test-data/station1.mp3 \
            --audio2 radio-test-data/station2.mp3 \
            --audio3 radio-test-data/station3.mp3 \
            --logo3 radio-test-data/logo3.png \
            > "$RESULTS_DIR/icy-server.log" 2>&1 &
          echo $! > "$RESULTS_DIR/icy-server.pid"
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Reclaim runner space and enable KVM
        run: |
          set -euxo pipefail
          ./gradlew --stop || true
          find . -type d -name build -prune -exec rm -rf {} +
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" "$HOME/.gradle/native" || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            "$ANDROID_HOME/ndk" \
            "$ANDROID_HOME/cmake" || true
          docker system prune -af || true
          test -f "$APK_PATH"
          sudo rm -rf "$ANDROID_AVD_HOME"
          sudo mkdir -p "$ANDROID_AVD_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          test "$available_kb" -ge 9000000

      - name: Run screenshot-based artist and Play All regression
        run: |
          set -euxo pipefail
          cp scripts/dudu7_v1371_regression_smoke.sh scripts/dudu7_ui_smoke.sh
          chmod +x scripts/run_dudu7_emulator_ci.sh scripts/dudu7_ui_smoke.sh
          scripts/run_dudu7_emulator_ci.sh
        env:
          ARTIST_SCROLL_ONLY: '1'

      - name: Confirm pixel and action evidence
        run: |
          set -euxo pipefail
          grep -q 'Dudu7 artist scroll regression passed' "$RESULTS_DIR/regression-smoke.log"
          test "$(grep -c 'PASS: artist pane has real rendered pixels after scrolling' "$RESULTS_DIR/regression-smoke.log")" -ge 2
          grep -q 'PASS: real Top Songs detail screen opened' "$RESULTS_DIR/regression-smoke.log"
          grep -q 'Dudu7ArtistAction.*Play all clicked' "$RESULTS_DIR/artist-play-all-log.txt"
          grep -q 'Dudu7RightPaneTap.*handled=true' "$RESULTS_DIR/artist-play-all-log.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-13.7.2-render-validation-${{ github.run_id }}
          path: |
            artifacts/
            ui-test-results/
          if-no-files-found: warn
          retention-days: 14
