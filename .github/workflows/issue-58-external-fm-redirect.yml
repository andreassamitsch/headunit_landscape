name: Validate external Syu FM favourite redirect

on:
  push:
    branches:
      - agent/issue-58-external-fm-favourite-redirect

permissions:
  contents: write

jobs:
  validate-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip external-fm]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-58-external-fm-favourite-redirect
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Correct directed FM seek inference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt')
          text = path.read_text()
          old = '''    val upDistance =
              if (observed > current) {
                  observed - current
              } else {
                  (SYU_FM_MAX - current) + SYU_FM_STEP + (observed - SYU_FM_MIN)
              }
          val downDistance =
              if (observed < current) {
                  current - observed
              } else {
                  (current - SYU_FM_MIN) + SYU_FM_STEP + (SYU_FM_MAX - observed)
              }
          return upDistance <= downDistance
          '''
          new = '''    val highEdge = SYU_FM_MAX - SYU_FM_WRAP_EDGE_MHZ
          val lowEdge = SYU_FM_MIN + SYU_FM_WRAP_EDGE_MHZ
          return when {
              current >= highEdge && observed <= lowEdge -> true
              current <= lowEdge && observed >= highEdge -> false
              else -> observed > current
          }
          '''
          if old not in text:
              if 'SYU_FM_WRAP_EDGE_MHZ' in text:
                  raise SystemExit(0)
              raise SystemExit('Expected direction block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'private const val SYU_FM_STEP = 0.1f\n',
              'private const val SYU_FM_STEP = 0.1f\nprivate const val SYU_FM_WRAP_EDGE_MHZ = 2.0f\n',
              1,
          )
          path.write_text(text)
          PY

      - name: Set version 13.7.44
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          if 'versionCode = 1370053' in text and 'versionName = "13.7.44"' in text:
              raise SystemExit(0)
          if text.count('versionCode = 1370052') != 1 or text.count('versionName = "13.7.43"') != 1:
              raise SystemExit('Unexpected current version')
          text = text.replace('versionCode = 1370052', 'versionCode = 1370053', 1)
          text = text.replace('versionName = "13.7.43"', 'versionName = "13.7.44"', 1)
          path.write_text(text)
          PY

      - name: Verify safety constraints
        shell: bash
        run: |
          set -euo pipefail
          IPC=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt
          RADIO=app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt

          grep -q 'versionCode = 1370053' app/build.gradle.kts
          grep -q 'versionName = "13.7.44"' app/build.gradle.kts
          grep -q 'SYU_RADIO_MODULE = 1' "$IPC"
          grep -q 'SYU_STEER_MODULE = 10' "$IPC"
          grep -q 'redirectExternalTune' "$IPC"
          grep -q 'PhysicalFmMediaKeyBridge.handleDirection' "$IPC"
          grep -q 'sourceOwnerPackage != appContext.packageName' "$IPC"
          grep -q 'snapshot.isBusy' "$IPC"
          grep -q 'snapshot.isScanning' "$IPC"
          grep -q 'SYU_FM_WRAP_EDGE_MHZ' "$IPC"
          grep -q 'val openOk = fm.openDev()' "$RADIO"
          ! grep -q 'extractSyuMediaKeyCandidate' "$IPC"
          ! grep -Eq 'module\.cmd\([^\n]*26|command *= *26' "$IPC"
          ! grep -Eq 'TwUtilBridge|twUtil\?\.|Dudu7FytTwController' "$RADIO"

      - name: Commit implementation adjustments
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app; then
            echo 'Implementation and version already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app
            git commit -m 'fix: use directed FM seek with edge wrap [skip external-fm]'
            git push origin HEAD:agent/issue-58-external-fm-favourite-redirect
          fi

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.44.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.44.apk' > 'artifact/Metrolist dudu7 13.7.44.apk.sha256'

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging 'artifact/Metrolist dudu7 13.7.44.apk' > artifact/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist dudu7 13.7.44.apk' > artifact/apksigner.txt
          unzip -l 'artifact/Metrolist dudu7 13.7.44.apk' > artifact/apk-contents.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370053' versionName='13.7.44-dudu7'" artifact/aapt-badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/apksigner.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-contents.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.44-external-fm-redirect
          path: artifact/*
          if-no-files-found: error
