name: Build Metrolist dudu7 13.7.47 radio logos

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dudu7-13747-radio-logos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v3

      - name: Validate radio logo source
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'versionCode = 1370056' app/build.gradle.kts
          grep -q 'versionName = "13.7.47"' app/build.gradle.kts
          FM_RESOLVER='app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/ReliableFmStationLogoResolver.kt'
          PAGE_RESOLVER='app/src/main/kotlin/com/metrolist/music/radio/RadioAtPageLogoResolver.kt'
          PAGE_TEST='app/src/test/kotlin/com/metrolist/music/radio/RadioAtPageLogoResolverTest.kt'
          grep -q 'https://www.radio.at/300/\$radioAtSlug.png?version=' "$FM_RESOLVER"
          grep -q 'RadioAtPageLogoResolver.resolve' "$FM_RESOLVER"
          grep -q 'https://www.radio.at/s/\$normalizedSlug' "$PAGE_RESOLVER"
          grep -q '/175/oe24.jpeg?version=' "$PAGE_TEST"
          if grep -q 'RadioDnsLogoResolver' "$FM_RESOLVER"; then
            echo 'RadioDNS is still referenced by the FM logo resolver' >&2
            exit 1
          fi

      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          OUT='artifacts/Metrolist-dudu7-13.7.47.apk'
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370056'" artifacts/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l "$OUT" | tee artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          sha256sum "$OUT" > "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.47
          path: artifacts/
          retention-days: 14
