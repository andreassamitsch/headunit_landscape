name: Implement Dudu7 HTTP chunking 208

on:
  push:
    branches:
      - feature/download-http-chunking-208
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: implement-download-http-chunking-208
  cancel-in-progress: false

jobs:
  implement-test-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Apply issue 208 implementation
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_download_http_chunking_208.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in (
              'app/src/main/kotlin/com/metrolist/music/playback/HttpRangeChunkingDataSource.kt',
              'app/src/test/kotlin/com/metrolist/music/playback/HttpRangeChunkingDataSourceTest.kt',
          ):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'C\.LENGTH_UNSET(?!\.toLong\(\))', 'C.LENGTH_UNSET.toLong()', text)
              if name.endswith('HttpRangeChunkingDataSourceTest.kt'):
                  text = text.replace('5_836_352L', '5_836_592L')
              p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify implementation boundaries
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 1370092' app/build.gradle.kts
          grep -q 'versionName = "13.7.83"' app/build.gradle.kts
          CHUNKER=app/src/main/kotlin/com/metrolist/music/playback/HttpRangeChunkingDataSource.kt
          DOWNLOAD=app/src/main/kotlin/com/metrolist/music/playback/DownloadUtil.kt
          QUEUE=app/src/main/kotlin/com/metrolist/music/ui/screens/library/DownloadQueueScreen.kt
          TEST=app/src/test/kotlin/com/metrolist/music/playback/HttpRangeChunkingDataSourceTest.kt
          test -f "$CHUNKER"
          grep -q 'HTTP_DOWNLOAD_CHUNK_SIZE_BYTES = 10L \* 1024L \* 1024L' "$DOWNLOAD"
          grep -q 'HttpRangeChunkingDataSource.Factory' "$DOWNLOAD"
          grep -q 'BuildConfig.IS_DUDU7' "$DOWNLOAD"
          grep -q 'toggleDiagnosticHttpChunking' "$DOWNLOAD"
          grep -q 'http_chunking=' "$QUEUE"
          grep -q 'http_chunk_size_bytes=' "$QUEUE"
          grep -q 'http_chunks_completed=' "$QUEUE"
          grep -q 'HTTP A/B' "$QUEUE"
          grep -q 'base.subrange(bytesReadTotal, chunkLength)' "$CHUNKER"
          grep -q 'Server did not confirm requested byte range' "$CHUNKER"
          grep -q 'C.LENGTH_UNSET.toLong()' "$CHUNKER"
          grep -q '5_836_592L' "$TEST"
          if grep -q 'yt-dlp' app/build.gradle.kts; then
            echo 'yt-dlp dependency must not be added' >&2
            exit 1
          fi

      - name: Compile standard and run Dudu7 tests
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:compileGmsStandardDebugKotlin --no-daemon --stacktrace
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Commit validated implementation
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/kotlin/com/metrolist/music/playback/DownloadUtil.kt \
            app/src/main/kotlin/com/metrolist/music/playback/HttpRangeChunkingDataSource.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/library/DownloadQueueScreen.kt \
            app/src/test/kotlin/com/metrolist/music/playback/HttpRangeChunkingDataSourceTest.kt
          git commit -m 'feat(download): add yt-dlp-style HTTP chunking for #208'
          git push origin HEAD:feature/download-http-chunking-208
