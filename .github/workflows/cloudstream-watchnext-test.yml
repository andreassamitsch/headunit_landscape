name: CloudStream Watch Next Test

on:
  push:
    branches:
      - cloudstream-watchnext-test-build-20260807

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CloudStream
        uses: actions/checkout@v4
        with:
          repository: recloudstream/cloudstream
          ref: a72f9e6c3f2e25eb74ce0e7d6cc56dc33c130288
          path: cloudstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch Android TV Watch Next handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cloudstream/app/src/main/java/com/lagradost/cloudstream3/utils/AppContextUtils.kt')
          text = path.read_text()

          old_signature = '''    private fun buildWatchNextProgramUri(
                  context: Context,
                  card: DataStoreHelper.ResumeWatchingResult,
                  resumeWatching: DownloadObjects.ResumeWatching?
              ): WatchNextProgram {'''
          new_signature = '''    private fun buildWatchNextProgramUri(
                  context: Context,
                  card: DataStoreHelper.ResumeWatchingResult,
                  resumeWatching: DownloadObjects.ResumeWatching?,
                  internalProviderId: String
              ): WatchNextProgram {'''

          # Source indentation can change without affecting semantics; use exact smaller replacements below.
          old_param = '''        resumeWatching: DownloadObjects.ResumeWatching?\n    ): WatchNextProgram {'''
          new_param = '''        resumeWatching: DownloadObjects.ResumeWatching?,\n        internalProviderId: String\n    ): WatchNextProgram {'''
          assert old_param in text, 'buildWatchNextProgramUri signature not found'
          text = text.replace(old_param, new_param, 1)

          old_provider_id = '.setInternalProviderId(card.url)'
          assert old_provider_id in text, 'old internal provider id assignment not found'
          text = text.replace(old_provider_id, '.setInternalProviderId(internalProviderId)', 1)

          old_call = '''                    val nextProgram = buildWatchNextProgramUri(
                          context,
                          episodeInfo,
                          timeStampHashMap[episodeInfo.id]
                      )'''
          new_call = '''                    val resumeWatching = episodeInfo.parentId?.let { timeStampHashMap[it] }
                      val nextProgram = buildWatchNextProgramUri(
                          context,
                          episodeInfo,
                          resumeWatching,
                          customId
                      )'''
          assert old_call in text, 'old Watch Next call not found'
          text = text.replace(old_call, new_call, 1)

          path.write_text(text)

          assert 'timeStampHashMap[episodeInfo.id]' not in text
          assert '.setInternalProviderId(internalProviderId)' in text
          assert 'episodeInfo.parentId?.let { timeStampHashMap[it] }' in text
          assert 'resumeWatching,\n                        customId' in text
          print('Watch Next patch applied and source assertions passed.')
          PY

      - name: Show patch
        working-directory: cloudstream
        run: git diff -- app/src/main/java/com/lagradost/cloudstream3/utils/AppContextUtils.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build separate prerelease debug APK
        working-directory: cloudstream
        run: |
          chmod +x gradlew
          ./gradlew assemblePrereleaseDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          APK=$(find cloudstream/app/build/outputs/apk/prerelease/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" CloudStream-WatchNext-Test-a72f9e6.apk
          sha256sum CloudStream-WatchNext-Test-a72f9e6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-WatchNext-Test-a72f9e6
          path: CloudStream-WatchNext-Test-a72f9e6.apk
          if-no-files-found: error
          retention-days: 7
