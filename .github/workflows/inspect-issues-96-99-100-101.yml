name: Inspect issues 96 99 100 101

on:
  pull_request:
    branches: [agent/issues-94-96-97-frosted-fm-artwork]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Collect source context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/source
          {
            echo '=== WEBRADIO / QUEUE / ARTWORK / TAB REFERENCES ==='
            grep -RInE 'RadioStationRow|RadioStationCard|WebRadioScreen|Queue|thumbnailUrl|artworkUri|gradientColors|Dynamic|Tab\(|NavigationBar|surfaceContainer|selectedContainerColor' app/src --include='*.kt' || true
          } > inspection/report.txt
          paths=(
            app/build.gradle.kts
            app/src/main/kotlin/com/metrolist/music/ui/screens/radio
            app/src/main/kotlin/com/metrolist/music/ui/player
            app/src/main/kotlin/com/metrolist/music/playback
            app/src/main/kotlin/com/metrolist/music/radio
            app/src/dudu7/kotlin/com/metrolist/music/variant
            app/src/dudu7/kotlin/com/metrolist/music/playback
          )
          for p in "${paths[@]}"; do
            if [ -e "$p" ]; then
              mkdir -p "inspection/source/$(dirname "$p")"
              cp -R "$p" "inspection/source/$p"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: issues-96-99-100-101-source
          path: inspection/
          retention-days: 2
