name: Build Dudu7 13.7.66 portrait player

on:
  pull_request:
    branches: [agent/issues-124-126-portrait-resize-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build-emulate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"

      - name: Apply Issue 128 portrait Dudu7 player fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/apply_issue_128_portrait_dudu7_player.py
          if grep -q 'versionCode = 1370075' app/build.gradle.kts; then
            echo 'Issue 128 product patch already applied.'
          else
            python3 scripts/apply_issue_128_portrait_dudu7_player.py
          fi
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app scripts/apply_issue_128_portrait_dudu7_player.py
            git commit -m "Keep Dudu7 vehicle player in portrait [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify layout selection invariants
        shell: bash
        run: |
          set -euxo pipefail
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          grep -q 'versionCode = 1370075' app/build.gradle.kts
          grep -q 'versionName = "13.7.66"' app/build.gradle.kts
          grep -q 'internal fun shouldUseVehiclePlayerLayout' "$PLAYER"
          grep -q 'isDudu7: Boolean' "$PLAYER"
          grep -q 'isLandscape: Boolean' "$PLAYER"
          grep -q 'isDudu7 || isLandscape' "$PLAYER"
          grep -q 'shouldUseVehiclePlayerLayout(' "$PLAYER"
          grep -q 'VehicleLandscapeLayout(' "$PLAYER"
          test "$(grep -c 'when (LocalConfiguration.current.orientation)' "$PLAYER")" -eq 0
          test -f app/src/test/kotlin/com/metrolist/music/ui/player/Dudu7PlayerLayoutSelectionTest.kt

      - name: Compile standard flavor
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:compileGmsStandardDebugKotlin --no-daemon --stacktrace

      - name: Dudu7 unit tests
        run: |
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify production APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.66.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.66.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.66.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370075'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.66.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.66.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.66.apk > artifacts/Metrolist-dudu7-13.7.66.apk.sha256

      - name: Prepare x86_64 emulator APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build.gradle.kts /tmp/build.gradle.kts.production
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          if old not in s:
              raise SystemExit('production ABI filter anchor not found')
          p.write_text(s.replace(old, 'abiFilters += listOf("x86_64")', 1))
          PY
          rm -rf app/build/outputs/apk/gmsDudu7/debug
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/emulator-build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.66-x86_64-test.apk
          unzip -l artifacts/Metrolist-dudu7-13.7.66-x86_64-test.apk > artifacts/emulator-apk-contents.txt
          grep -q 'lib/x86_64/' artifacts/emulator-apk-contents.txt
          cp /tmp/build.gradle.kts.production app/build.gradle.kts

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulate portrait and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r artifacts/Metrolist-dudu7-13.7.66-x86_64-test.apk
            adb shell pm grant com.metrolist.music.dudu7.debug android.permission.POST_NOTIFICATIONS || true
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell am force-stop com.metrolist.music.dudu7.debug
            adb shell am start -W -n com.metrolist.music.dudu7.debug/com.metrolist.music.MainActivity
            sleep 15
            for attempt in 1 2 3; do
              adb shell uiautomator dump /sdcard/window.xml || true
              adb pull /sdcard/window.xml artifacts/portrait-ui.xml || true
              if grep -q 'text="WebRadio"' artifacts/portrait-ui.xml && grep -q 'text="FM"' artifacts/portrait-ui.xml; then
                break
              fi
              adb shell input keyevent 4 || true
              sleep 4
            done
            adb exec-out screencap -p > artifacts/portrait-emulator.png
            adb shell dumpsys window displays > artifacts/window-displays.txt
            adb shell dumpsys activity top > artifacts/activity-top.txt
            python3 - <<'PY'
            import re
            import xml.etree.ElementTree as ET
            from pathlib import Path
            xml = Path('artifacts/portrait-ui.xml')
            if not xml.exists():
                raise SystemExit('portrait UI hierarchy missing')
            root = ET.parse(xml).getroot()
            found = {}
            for node in root.iter('node'):
                text = node.attrib.get('text', '')
                if text in {'WebRadio', 'FM'}:
                    m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                    if m:
                        found[text] = tuple(map(int, m.groups()))
            print('portrait tab bounds:', found)
            if 'WebRadio' not in found or 'FM' not in found:
                raise SystemExit('Dudu7 tabs not present in portrait UI')
            for name, (_, y1, _, y2) in found.items():
                if not (780 <= y1 <= 1250):
                    raise SystemExit(f'{name} is not in lower 50% region: y={y1}..{y2}')
            PY

      - name: Upload verified APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.66-apk-and-portrait-evidence
          path: |
            artifacts/Metrolist-dudu7-13.7.66.apk
            artifacts/Metrolist-dudu7-13.7.66.apk.sha256
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
            artifacts/emulator-build.log
            artifacts/emulator-apk-contents.txt
            artifacts/portrait-emulator.png
            artifacts/portrait-ui.xml
            artifacts/window-displays.txt
            artifacts/activity-top.txt
          retention-days: 14
