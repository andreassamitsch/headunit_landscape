name: Build Dudu7 Physical Radio APK

on:
  push:
    branches: ["agent/dudu7-physical-radio"]

permissions:
  contents: write

concurrency:
  group: physical-radio-dudu7-apk
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Apply Dudu7 physical radio integration
        run: |
          python3 scripts/apply_dudu7_physical_radio.py
          python3 scripts/prepare_physical_radio_sources.py
          grep -q 'PHYSICAL_RADIO("FM"' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'PhysicalRadioScreen()' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/dudu7/AndroidManifest.xml

      - name: Build targeted Dudu7 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleGmsDudu7Debug -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Metrolist Dudu7
          METROLIST_DEBUG_KEYSTORE_PATH: keystore/dudu7-debug.keystore
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Metrolist-Dudu7-13.7.1-PhysicalRadio.apk
          sha256sum dist/Metrolist-Dudu7-13.7.1-PhysicalRadio.apk > dist/Metrolist-Dudu7-13.7.1-PhysicalRadio.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: Metrolist-Dudu7-13.7.1-PhysicalRadio
          path: dist/Metrolist-Dudu7-13.7.1-PhysicalRadio.*
          if-no-files-found: error

      - name: Publish validated sources and APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/dudu7/AndroidManifest.xml \
                  app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt \
                  app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt \
                  dist/Metrolist-Dudu7-13.7.1-PhysicalRadio.*
          git commit -m "feat(dudu7): publish validated physical radio integration [skip ci]"
          git push origin HEAD:agent/dudu7-physical-radio
