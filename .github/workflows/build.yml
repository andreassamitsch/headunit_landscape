name: Build FYT Radio Test APK

on:
  push:
    branches: ["agent/fyt-radio-test-apk"]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract isolated project
        run: |
          mkdir project
          tar -xzf fyt-radio-test-source.tar.gz -C project
      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Collect artifact
        run: |
          mkdir -p dist
          cp project/app/build/outputs/apk/debug/app-debug.apk dist/FYT-DUDU7-Radio-Test-0.1.0.apk
          sha256sum dist/FYT-DUDU7-Radio-Test-0.1.0.apk > dist/FYT-DUDU7-Radio-Test-0.1.0.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: FYT-DUDU7-Radio-Test-0.1.0
          path: dist/*
          if-no-files-found: error
      - name: Publish APK on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/FYT-DUDU7-Radio-Test-0.1.0.*
          git commit -m "artifact: FYT Radio Test APK [skip ci]"
          git push origin HEAD:agent/fyt-radio-test-apk
