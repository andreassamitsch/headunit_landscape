name: Export FYT Radio Test APK

on:
  push:
    branches: ["agent/fyt-radio-test-apk"]

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Split APK into transport-safe text parts
        run: |
          test -f dist/FYT-DUDU7-Radio-Test-0.1.0.apk
          rm -rf dist/apk_parts
          mkdir -p dist/apk_parts
          base64 -w0 dist/FYT-DUDU7-Radio-Test-0.1.0.apk > /tmp/fyt-radio.apk.b64
          split -b 20000 -d -a 2 /tmp/fyt-radio.apk.b64 dist/apk_parts/part-
          sha256sum dist/FYT-DUDU7-Radio-Test-0.1.0.apk > dist/apk_parts/original.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/apk_parts
          git commit -m "artifact: export APK text parts [skip ci]"
          git push origin HEAD:agent/fyt-radio-test-apk
