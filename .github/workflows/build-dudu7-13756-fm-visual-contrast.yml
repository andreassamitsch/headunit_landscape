name: Build Dudu7 13.7.56 FM Visual Contrast

on:
  pull_request:
    branches: [agent/issue-104-fm-glass-consistency]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v3

      - name: Apply issues 97 and 106
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionCode = 1370065' app/build.gradle.kts \
            && grep -q 'Dudu7FmVisualSnapshot' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt \
            && grep -q 'onPhysicalRadioVisualChanged' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt; then
            echo 'Issues #97/#106 product patch already applied.'
          else
            python3 scripts/apply_issues_97_106.py
          fi
          rm -f .github/workflows/inspect-issues-97-106.yml
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A \
              app/build.gradle.kts \
              app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt \
              .github/workflows/inspect-issues-97-106.yml
            git commit -m "Unify FM artwork and adaptive Frosted Ice contrast [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          LAYOUT=app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'versionCode = 1370065' app/build.gradle.kts
          grep -q 'versionName = "13.7.56"' app/build.gradle.kts
          grep -q 'Dudu7FmVisualSnapshot' "$PLAYER"
          grep -q 'val effectiveArtworkUrl' "$PLAYER"
          grep -q 'targetState = effectiveArtworkUrl' "$PLAYER"
          grep -q 'latestVisualArtworkKey == artworkCacheKey' "$PLAYER"
          grep -q 'PlayerBackgroundStyle.BLUR, PlayerBackgroundStyle.GRADIENT -> adaptiveVisualContentColor' "$PLAYER"
          grep -q 'onPhysicalRadioVisualChanged' "$PLAYER"
          grep -q 'FmNowPlayingResolver.state.collectAsStateWithLifecycle' "$LAYOUT"
          grep -q 'ReliableFmStationLogoResolver.resolve' "$LAYOUT"
          grep -q 'onBackground = adaptiveContentColor' "$LAYOUT"
          grep -q 'onSurface = adaptiveContentColor' "$LAYOUT"
          grep -q 'onSurfaceVariant = adaptiveSecondaryContentColor' "$LAYOUT"
          grep -q 'onPrimaryContainer = adaptiveContentColor' "$LAYOUT"
          grep -q 'onSecondaryContainer = adaptiveContentColor' "$LAYOUT"
          grep -q 'onTertiaryContainer = adaptiveContentColor' "$LAYOUT"
          grep -q 'outline = adaptiveContentColor.copy(alpha = 0.62f)' "$LAYOUT"
          grep -q 'else {' "$LAYOUT"
          grep -q 'baseColors' "$LAYOUT"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.56.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.56.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.56.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370065'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.56.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.56.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.56.apk > artifacts/Metrolist-dudu7-13.7.56.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.56-apk
          path: |
            artifacts/Metrolist-dudu7-13.7.56.apk
            artifacts/Metrolist-dudu7-13.7.56.apk.sha256
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
          retention-days: 14
