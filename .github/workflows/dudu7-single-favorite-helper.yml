name: Commit validated WebRadio single-stream source

on:
  push:
    branches:
      - agent/webradio-single-favorite-build
    paths:
      - .github/workflows/dudu7-single-favorite-helper.yml

permissions:
  contents: write

jobs:
  commit-validated-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SOURCE_BRANCH: agent/fm-radio-ui-logos-tabs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          fetch-depth: 0
          submodules: recursive

      - name: Apply emulator-validated source
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_webradio_single_favorite.py
          git diff --check
          grep -q 'items = listOf(playable.toMediaItem())' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'radioFavoriteNeighbor' app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt
          grep -q 'versionCode = 161' app/build.gradle.kts

      - name: Commit and push source only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts \
            app/src/main/kotlin/com/metrolist/music/playback/PlayerConnection.kt \
            app/src/main/kotlin/com/metrolist/music/radio/RadioFavoriteQueue.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
            app/src/test/kotlin/com/metrolist/music/radio/RadioFavoriteNavigationTest.kt
          git commit -m 'Play WebRadio favorites as single streams [skip ci]'
          git push origin HEAD:"$SOURCE_BRANCH"
