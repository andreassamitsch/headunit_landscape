name: Resume WebRadio favorites emulator validation

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-webradio-favorites-emulator-resume.yml

permissions:
  contents: write

concurrency:
  group: dudu7-webradio-favorites-emulator-resume
  cancel-in-progress: true

jobs:
  emulator-and-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      METROLIST_APPLICATION_ID: com.metrolist.music
      METROLIST_APP_NAME: Metrolist
      METROLIST_DEBUG_KEYSTORE_PATH: keystore/dudu7-debug.keystore
      METROLIST_DEBUG_KEYSTORE_PASSWORD: android
      METROLIST_DEBUG_KEY_ALIAS: androiddebugkey
      METROLIST_DEBUG_KEY_PASSWORD: android
      PACKAGE_NAME: com.metrolist.music.dudu7
      ACTIVITY_NAME: com.metrolist.music.MainActivity
      RESULTS_DIR: ui-test-results-favorites-hotfix
      APK_PATH: dist/Metrolist-Dudu7-Favorites-Hotfix-x86.apk
      ANDROID_AVD_HOME: /mnt/android-avd-favorites-hotfix
      API_LEVEL: 34
      SYSTEM_TARGET: google_atd
      DATA_PARTITION_SIZE: 1536M
      DUDU_WIDTH: 1280
      DUDU_HEIGHT: 720
      DUDU_DENSITY: 200
      STATUS_FILE: .build-metadata/dudu7-webradio-favorites-hotfix-run.txt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          submodules: recursive
          fetch-depth: 0

      - name: Record resumed workflow
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build-metadata
          printf 'run_id=%s\nstatus=running-emulator-diagnostic\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record diagnostic favorites emulator run [skip ci]'
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Apply hotfix and prepare x86 sources
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_webradio_immediate_favorites_fix.py
          git diff --check
          mkdir -p dist artifacts "$RESULTS_DIR"
          cp app/build.gradle.kts /tmp/build.gradle.production.kts
          cp app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt /tmp/RadioBrowserClient.production.kt
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('abiFilters += listOf("arm64-v8a", "armeabi-v7a")', 'abiFilters += listOf("x86_64")', 1)
          gradle.write_text(text, encoding='utf-8')
          client = Path('app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt')
          text = client.read_text(encoding='utf-8')
          text = text.replace('https://all.api.radio-browser.info/json/stations/byuuid', 'http://10.0.2.2:8000/json/stations/byuuid', 1)
          client.write_text(text, encoding='utf-8')
          PY

      - name: Build deterministic x86 APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf app/build
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-x86.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$APK_PATH"
          unzip -l "$APK_PATH" | grep 'lib/x86_64/'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare deterministic radio service
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p radio-test-data "$RESULTS_DIR"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=24' -c:a libmp3lame -b:a 96k radio-test-data/station1.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=660:duration=24' -c:a libmp3lame -b:a 96k radio-test-data/station2.mp3
          python3 scripts/icy_round3_test_server.py --audio1 radio-test-data/station1.mp3 --audio2 radio-test-data/station2.mp3 > "$RESULTS_DIR/radio-server.log" 2>&1 &
          echo $! > "$RESULTS_DIR/radio-server.pid"
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Reclaim space and enable emulator
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf "$ANDROID_AVD_HOME"
          sudo mkdir -p "$ANDROID_AVD_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm

      - name: Run deterministic favorites regression with diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          cp scripts/dudu7_round3_reliability_smoke.sh scripts/dudu7_ui_smoke.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/dudu7_ui_smoke.sh')
          text = path.read_text(encoding='utf-8')
          marker = 'exec > >(tee "$RESULTS_DIR/round3-smoke.log") 2>&1\n'
          diagnostic = r'''

diagnostic_exit() {
  local status=$?
  trap - EXIT
  adb shell pidof "$PACKAGE_NAME" > "$RESULTS_DIR/app-pid-at-exit.txt" 2>&1 || true
  adb logcat -d -v threadtime > "$RESULTS_DIR/logcat-at-exit.txt" 2>&1 || true
  adb shell dumpsys activity activities > "$RESULTS_DIR/activities-at-exit.txt" 2>&1 || true
  adb shell dumpsys window windows > "$RESULTS_DIR/windows-at-exit.txt" 2>&1 || true
  adb shell dumpsys package "$PACKAGE_NAME" > "$RESULTS_DIR/package-at-exit.txt" 2>&1 || true
  capture "exit-state" || true
  exit "$status"
}
trap diagnostic_exit EXIT
'''
          if marker not in text:
              raise SystemExit('smoke log marker missing')
          path.write_text(text.replace(marker, marker + diagnostic, 1), encoding='utf-8')
          PY
          chmod +x scripts/run_dudu7_emulator_ci.sh scripts/dudu7_ui_smoke.sh
          scripts/run_dudu7_emulator_ci.sh

      - name: Confirm and commit hotfix
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'PASS: favorite starts immediately and latest selection wins delayed refresh' "$RESULTS_DIR/round3-smoke.log"
          grep -q 'PASS: stale favorite one URL persisted as current station1 URL' "$RESULTS_DIR/round3-smoke.log"
          grep -q 'PASS: stale favorite two URL persisted as current station2 URL' "$RESULTS_DIR/round3-smoke.log"
          ! grep -E "FATAL EXCEPTION|ANR in ${PACKAGE_NAME}" "$RESULTS_DIR/logcat-at-exit.txt"
          cp /tmp/RadioBrowserClient.production.kt app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt
          cp /tmp/build.gradle.production.kts app/build.gradle.kts
          rm -f scripts/dudu7_ui_smoke.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt scripts/dudu7_round3_reliability_smoke.sh
          git diff --cached --check
          git commit -m 'Start Dudu7 WebRadio favorites immediately [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
          printf 'run_id=%s\nstatus=success\nvalidated_commit=%s\narm_artifact_run=30161275480\n' \
            "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" > "$STATUS_FILE"
          git add "$STATUS_FILE"
          git commit -m 'Record successful favorites emulator validation [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - name: Restore production files
        if: always()
        shell: bash
        run: |
          set +e
          test -f /tmp/RadioBrowserClient.production.kt && cp /tmp/RadioBrowserClient.production.kt app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt
          test -f /tmp/build.gradle.production.kts && cp /tmp/build.gradle.production.kts app/build.gradle.kts
          rm -f scripts/dudu7_ui_smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-WebRadio-Favorites-Emulator-${{ github.run_id }}
          path: |
            artifacts/
            dist/
            ui-test-results-favorites-hotfix/
          if-no-files-found: warn
          retention-days: 14

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git fetch origin agent/fm-radio-ui-logos-tabs
          git checkout -B agent/fm-radio-ui-logos-tabs origin/agent/fm-radio-ui-logos-tabs
          mkdir -p .build-metadata
          printf 'run_id=%s\nstatus=failure-emulator-diagnostic\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record failed diagnostic favorites emulator validation [skip ci]' || exit 0
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
