name: Dudu7 13.7.21 FM identity and AF

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dudu7-13721-fm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref || github.ref }}

      - name: Apply and persist FM identity and AF implementation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_13721_fm_identity_af.py

          rm -f \
            scripts/apply_dudu7_13721_fm_identity_af.py \
            .github/workflows/dudu7-13721-fm-identity-af.yml \
            .github/dudu7-13721-marker.txt

          git diff --check
          grep -q 'versionCode = 1370030' app/build.gradle.kts
          grep -q 'versionName = "13.7.21"' app/build.gradle.kts
          grep -q 'val stableStationId' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'measureAlternativeFrequency' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'key in FytPhysicalRadio.presetOrderKeys' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt
          grep -q 'station_${resolved.stableId' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/ReliableFmStationLogoResolver.kt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(fm): stabilize station identity and compare AF candidates [skip ci]'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate source and run FM unit tests
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          grep -q 'appNameOverride ?: "Metrolist dudu7"' app/build.gradle.kts
          if grep -q 'UPDATER_AVAILABLE", "true"' app/build.gradle.kts; then
            echo 'Original Metrolist updater was re-enabled' >&2
            exit 1
          fi
          ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build GMS Dudu7 ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify update APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          OUT='dist/Metrolist-dudu7-13.7.21.apk'
          cp "$APK" "$OUT"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > dist/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" > dist/apk-signature.txt
          unzip -l "$OUT" > dist/apk-contents.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370030'" dist/apk-badging.txt
          grep -q "versionName='13.7.21-dudu7'" dist/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" dist/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' dist/apk-signature.txt
          grep -q 'lib/arm64-v8a/' dist/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' dist/apk-contents.txt
          sha256sum "$OUT" > "${OUT}.sha256"

          cat > dist/validation-summary.txt <<'EOF'
          PASS: stable FM station identity regression tests
          PASS: ANTENNE/STMK canonical identity and order alias migration
          PASS: AF strongest-candidate, foreign-PI and unknown-PI trust tests
          PASS: GMS Dudu7 debug ARM64/ARMv7 build
          PASS: package, version, label and update-signature verification
          EOF

      - name: Upload APK and validation output
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.21
          path: |
            dist/*
            app/build/reports/tests/testGmsDudu7DebugUnitTest/**
            app/build/test-results/testGmsDudu7DebugUnitTest/**
          if-no-files-found: error
          retention-days: 14
