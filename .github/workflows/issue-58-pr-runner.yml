name: Issue 58 NavRadio TWUtil parity

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  test-build:
    if: github.event.pull_request.head.ref == 'agent/issue-58-navradio-twutil-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-58-navradio-twutil-parity
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Apply final NavRadio lifecycle alignment
        run: python3 tools/issue58_navradio_lifecycle_patch.py

      - name: Commit lifecycle alignment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/Dudu7FytTwController.kt \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          git commit -m "Align shared TWUtil lifecycle with NavRadio [skip ci]"
          git push origin HEAD:agent/issue-58-navradio-twutil-parity

      - name: Verify implementation structure
        shell: bash
        run: |
          set -euo pipefail
          test -f metroproto/listentogether.proto
          test -f app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/Dudu7FytTwController.kt
          ! grep -q 'Dudu7FytTwMediaKeys(appContext)' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt
          grep -q 'Dudu7FytTwController.get(applicationContext)' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'Dudu7FytTwController.get(appContext).close()' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt
          ! grep -q 'initRadioSequence' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          ! grep -q 'setAudioSourceFm' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          ! grep -q 'twUtil?.close()' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'versionCode = 1370049' app/build.gradle.kts
          grep -q 'versionName = "13.7.40"' app/build.gradle.kts

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "artifacts/Metrolist dudu7 13.7.40.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "artifacts/Metrolist dudu7 13.7.40.apk" | tee artifacts/aapt-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "artifacts/Metrolist dudu7 13.7.40.apk" | tee artifacts/apksigner.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370049' versionName='13.7.40-dudu7'" artifacts/aapt-badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifacts/apksigner.txt
          unzip -l "artifacts/Metrolist dudu7 13.7.40.apk" | grep -q 'lib/arm64-v8a/'
          unzip -l "artifacts/Metrolist dudu7 13.7.40.apk" | grep -q 'lib/armeabi-v7a/'
          sha256sum "artifacts/Metrolist dudu7 13.7.40.apk" | tee "artifacts/Metrolist dudu7 13.7.40.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.40-navradio-twutil
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
