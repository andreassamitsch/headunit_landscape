name: Build Dudu7 13.7.63 FM alignment and bottom scrim

on:
  pull_request:
    branches: [agent/issue-119-haze-backdrop-blur]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"

      - name: Apply Issues 111 and 122
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('scripts/apply_issues_111_122.py')
          text = path.read_text()
          text = text.replace('if count != 1:', 'if count < 1:', 1)
          path.write_text(text)
          PYFIX
          python3 -m py_compile scripts/apply_issues_111_122.py
          if grep -q 'versionCode = 1370072' app/build.gradle.kts; then
            echo 'Product patch already applied.'
          else
            python3 scripts/apply_issues_111_122.py
          fi
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app scripts/apply_issues_111_122.py
            git commit -m "Align FM player and add Dudu7 bottom scrim [skip ci]"
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Verify implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          PLAYER=app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
          PREFS=app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt
          APPEARANCE=app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt
          METRICS=app/src/main/kotlin/com/metrolist/music/ui/player/VehicleRadioPlayerMetrics.kt
          FM=app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          CONTROLS=app/src/dudu7/kotlin/com/metrolist/music/variant/VehiclePlayerControls.kt

          grep -q 'versionCode = 1370072' app/build.gradle.kts
          grep -q 'versionName = "13.7.63"' app/build.gradle.kts
          grep -q 'Dudu7BackgroundBottomScrimStrengthKey' "$PREFS"
          grep -q 'valueRange = 0f..100f' "$APPEARANCE"
          grep -q 'steps = 99' "$APPEARANCE"
          grep -q 'dudu7BackgroundBottomScrimAlpha' "$PLAYER"
          grep -q '0.48f to Color.Transparent' "$PLAYER"
          grep -q 'VehicleRadioPlayerMetrics.ArtworkHorizontalPadding' "$PLAYER"
          test -s "$METRICS"
          grep -q 'VehicleRadioPlayerMetrics.ArtworkHorizontalPadding' "$FM"
          grep -q 'VehicleRadioPlayerMetrics.PlayButtonSize' "$FM"
          grep -q 'R.drawable.manage_search' "$FM"
          grep -q 'VehicleRadioPlayerMetrics.PlayButtonSize' "$CONTROLS"
          ! grep -q 'coerceAtMost(340.dp)' "$FM"
          ! grep -q 'R.drawable.search' "$FM"

      - name: Compile standard flavor
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:compileGmsStandardDebugKotlin --no-daemon --stacktrace

      - name: Dudu7 unit tests
        run: |
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.63.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.63.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.63.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370072'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.63.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          stat -c '%s' artifacts/Metrolist-dudu7-13.7.63.apk > artifacts/apk-size.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.63.apk > artifacts/Metrolist-dudu7-13.7.63.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.63-apk
          path: |
            artifacts/Metrolist-dudu7-13.7.63.apk
            artifacts/Metrolist-dudu7-13.7.63.apk.sha256
            artifacts/apk-size.txt
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
          retention-days: 14
