name: Dudu7 APK Build

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dudu7-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Dudu7 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Prepare Gradle wrapper
        shell: bash
        run: chmod +x gradlew

      - name: Build Dudu7 debug APK
        shell: bash
        run: ./gradlew :app:assembleFossDudu7Debug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/foss/dudu7/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/MetroList-Dudu7-HLS-LogoFix.apk
          sha256sum dist/MetroList-Dudu7-HLS-LogoFix.apk > dist/MetroList-Dudu7-HLS-LogoFix.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroList-Dudu7-HLS-LogoFix
          path: dist/*
          if-no-files-found: error
          retention-days: 14
