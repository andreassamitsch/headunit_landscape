name: Build Metrolist dudu7 13.7.31 FM steering fix

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dudu7-13731-fm-steering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply source fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_13731_fm_steering_fix.py
          python3 -m py_compile scripts/apply_dudu7_13731_fm_steering_fix.py
          git diff --check
          grep -q 'versionCode = 1370040' app/build.gradle.kts
          grep -q 'versionName = "13.7.31"' app/build.gradle.kts
          grep -q 'fun resolveCurrentIndex' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmFavouriteModel.kt
          grep -q 'fun adjacentIndex' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmFavouriteModel.kt
          grep -q 'FmFavouriteNavigationMemory.resolve' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmPresetOrderStore.kt
          grep -q 'rememberFmFavouriteSelection(preset.id)' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'missing active favourite falls back once then advances' app/src/test/kotlin/com/metrolist/music/radio/fyt/FmFavouriteModelTest.kt

      - name: Persist clean source
        shell: bash
        run: |
          set -euxo pipefail
          rm scripts/apply_dudu7_13731_fm_steering_fix.py
          rm scripts/.keep13731
          rm .github/workflows/build-dudu7-13731-fm-steering.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app scripts .github/workflows
          git commit -m 'fix(dudu7): restore deterministic FM favourite steering navigation [skip ci]'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Focused FM favourite regression tests
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:testGmsDudu7DebugUnitTest --tests 'com.metrolist.music.radio.fyt.FmFavouriteModelTest' --no-daemon --stacktrace

      - name: Full Dudu7 unit tests
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euxo pipefail
          ./gradlew :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build update-compatible ARM APK
        shell: bash
        env:
          METROLIST_APP_NAME: Metrolist dudu7
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace
          mkdir -p artifact
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" artifact/Metrolist-dudu7-13.7.31.apk

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifact/Metrolist-dudu7-13.7.31.apk | tee artifact/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifact/Metrolist-dudu7-13.7.31.apk | tee artifact/apk-signature.txt
          unzip -l artifact/Metrolist-dudu7-13.7.31.apk > artifact/apk-list.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370040' versionName='13.7.31-dudu7'" artifact/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifact/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifact/apk-signature.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-list.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-list.txt
          sha256sum artifact/Metrolist-dudu7-13.7.31.apk | tee artifact/Metrolist-dudu7-13.7.31.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.31
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
