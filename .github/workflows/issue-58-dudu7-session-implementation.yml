name: Implement and validate Dudu7 FM session ownership

on:
  push:
    branches:
      - agent/issue-58-dudu7-media-session-ownership

permissions:
  contents: write

jobs:
  implement-test-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip dudu-session]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-58-dudu7-media-session-ownership
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply verified Dudu7 backend ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import com.metrolist.music.playback.Dudu7FmMediaButtonRouting\n'
              'import com.metrolist.music.playback.Dudu7FmSessionRouting\n',
              'import com.metrolist.music.playback.Dudu7FmMediaButtonRouting\n'
              'import com.metrolist.music.playback.Dudu7FmSessionOwnership\n'
              'import com.metrolist.music.playback.Dudu7FmSessionRouting\n'
              'import com.metrolist.music.playback.MediaKeyDiagnostics\n',
          )
          replace_once('import java.lang.reflect.Method\n', '')
          replace_once(
              ' * It talks directly to the firmware-provided libfmjni.so and TWUtil MCU bridge;\n'
              ' * NavRadio+ is neither referenced nor required at runtime.\n',
              ' * It uses the Dudu7/UIS7870 FmService/FmNative path exposed by the Syu RadioProxy.\n'
              ' * Optional TWUtil backends belong to other head-unit families and are not used here.\n',
          )
          replace_once(
              '    private const val AF_RSSI_HYSTERESIS = 3\n',
              '    private const val AF_RSSI_HYSTERESIS = 3\n'
              '    private const val DUDU7_SESSION_PROPAGATION_MS = 150L\n',
          )
          replace_once('    private var twUtil: TwUtilBridge? = null\n', '')
          replace_once('            twUtil = TwUtilBridge()\n', '')

          replace_once(
              '''            try {
                requestAudioFocus()
                FytAudioRouter.prepare(context)
                installRdsListener()

                twUtil?.open()
                twUtil?.initRadioSequence()
                delay(150)
                twUtil?.radioOnFm()
                delay(100)
                twUtil?.unmute()
                delay(50)

                val openOk = fm.openDev()
                val powerOk = fm.powerUp(target)
                runCatching { fm.setRds(false) }
                val tuneOk = fm.tune(target)
                fm.setMute(false)
                repeat(3) { index ->
                    twUtil?.setAudioSourceFm()
                    if (index < 2) delay(100)
                }
                FmNative.setFirmwareFmVolumeEnabled(true)
''',
              '''            try {
                // NavRadio+ publishes its Dudu7 MediaSession before claiming RadioProxy/FmNative.
                // Give Android/com.syu.ms one dispatch turn before activating the hardware source.
                val claimChanged = Dudu7FmSessionOwnership.claim()
                MediaKeyDiagnostics.record(
                    context,
                    "DUDU7_SESSION_CLAIM",
                    "source=powerOn claimed=true changed=$claimChanged target=$target",
                )
                delay(DUDU7_SESSION_PROPAGATION_MS)

                requestAudioFocus()
                FytAudioRouter.prepare(context)
                installRdsListener()

                val openOk = fm.openDev()
                val powerOk = fm.powerUp(target)
                runCatching { fm.setRds(false) }
                val tuneOk = fm.tune(target)
                fm.setMute(false)
                FmNative.setFirmwareFmVolumeEnabled(true)
''',
          )

          replace_once(
              '''            } catch (error: Throwable) {
                Timber.tag(TAG).e(error, "Could not start physical FM")
                cleanupHardware()
                _state.update { it.copy(isActive = false, isBusy = false, error = error.message ?: "Radio konnte nicht gestartet werden") }
            }
''',
              '''            } catch (error: Throwable) {
                Timber.tag(TAG).e(error, "Could not start physical FM")
                cleanupHardware()
                val released = Dudu7FmSessionOwnership.release()
                MediaKeyDiagnostics.record(
                    context,
                    "DUDU7_SESSION_CLAIM",
                    "source=powerOn_failed claimed=false changed=$released error=${error.javaClass.simpleName}",
                )
                _state.update { it.copy(isActive = false, isBusy = false, error = error.message ?: "Radio konnte nicht gestartet werden") }
            }
''',
          )

          replace_once(
              '''            }
            Timber.tag(TAG).i("Physical FM released")
''',
              '''            }
            val released = Dudu7FmSessionOwnership.release()
            appContext?.let { context ->
                MediaKeyDiagnostics.record(
                    context,
                    "DUDU7_SESSION_CLAIM",
                    "source=powerOff claimed=false changed=$released",
                )
            }
            Timber.tag(TAG).i("Physical FM released")
''',
          )

          replace_once(
              '''        runCatching { native?.closeDev() }
        runCatching { twUtil?.radioOff() }
        runCatching { twUtil?.close() }
        FmNative.setFirmwareFmVolumeEnabled(false)
''',
              '''        runCatching { native?.closeDev() }
        FmNative.setFirmwareFmVolumeEnabled(false)
''',
          )

          marker = '\n    private class TwUtilBridge {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('TwUtilBridge class not found')
          if not text.rstrip().endswith('}'):
              raise SystemExit('Unexpected FytPhysicalRadio ending')
          text = text[:start] + '\n}\n'
          path.write_text(text)

          gradle = Path('app/build.gradle.kts')
          build = gradle.read_text()
          if build.count('versionCode = 1370050') != 1 or build.count('versionName = "13.7.41"') != 1:
              raise SystemExit('Unexpected current app version')
          build = build.replace('versionCode = 1370050', 'versionCode = 1370051', 1)
          build = build.replace('versionName = "13.7.41"', 'versionName = "13.7.42"', 1)
          gradle.write_text(build)
          PY

      - name: Verify Dudu7 reference constraints
        shell: bash
        run: |
          set -euo pipefail
          RADIO=app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          ROUTING=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt
          PLAYER=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt

          grep -q 'versionCode = 1370051' app/build.gradle.kts
          grep -q 'versionName = "13.7.42"' app/build.gradle.kts
          grep -q 'Dudu7FmSessionOwnership.claim()' "$RADIO"
          grep -q 'delay(DUDU7_SESSION_PROPAGATION_MS)' "$RADIO"
          grep -q 'val openOk = fm.openDev()' "$RADIO"
          ! grep -q 'TwUtilBridge' "$RADIO"
          ! grep -q 'Dudu7FytLegacyMediaSession' "$ROUTING"
          ! grep -q 'Dudu7FytTwMediaKeys' "$ROUTING"
          grep -q 'Dudu7FmSessionOwnership.claimed.collect' "$PLAYER"

          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt').read_text()
          claim = text.index('Dudu7FmSessionOwnership.claim()')
          propagate = text.index('delay(DUDU7_SESSION_PROPAGATION_MS)', claim)
          open_dev = text.index('val openOk = fm.openDev()', propagate)
          if not claim < propagate < open_dev:
              raise SystemExit('Session claim must precede propagation delay and FmNative.openDev')
          PY

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/dudu7 app/src/test/kotlin/com/metrolist/music/playback
          git commit -m 'fix: claim Dudu7 FM MediaSession before RadioProxy [skip dudu-session]'
          git push origin HEAD:agent/issue-58-dudu7-media-session-ownership

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.42.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.42.apk' > 'artifact/Metrolist dudu7 13.7.42.apk.sha256'

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging 'artifact/Metrolist dudu7 13.7.42.apk' > artifact/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist dudu7 13.7.42.apk' > artifact/apksigner.txt
          unzip -l 'artifact/Metrolist dudu7 13.7.42.apk' > artifact/apk-contents.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370051' versionName='13.7.42-dudu7'" artifact/aapt-badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/apksigner.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-contents.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.42-dudu7-session
          path: artifact/*
          if-no-files-found: error
