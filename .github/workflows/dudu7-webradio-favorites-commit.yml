name: Commit validated WebRadio favorites hotfix

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-webradio-favorites-commit.yml

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          fetch-depth: 0

      - name: Apply already validated hotfix
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_webradio_immediate_favorites_fix.py
          git diff --check
          grep -q 'startFavorite(initialPlayable)' app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt
          grep -q 'PASS: favorite starts immediately and latest selection wins delayed refresh' scripts/dudu7_round3_reliability_smoke.sh

      - name: Commit source and test
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt scripts/dudu7_round3_reliability_smoke.sh
          git commit -m 'Start Dudu7 WebRadio favorites immediately [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
          mkdir -p .build-metadata
          printf 'status=success\nvalidated_by_run=30161549459\nvalidated_commit=%s\narm_artifact_run=30161275480\napk_sha256=ec8614886547eabff38581446b220a57916c9b4893324f8beaa8d6b9ffbcd36a\n' "$(git rev-parse HEAD)" > .build-metadata/dudu7-webradio-favorites-hotfix-run.txt
          git add .build-metadata/dudu7-webradio-favorites-hotfix-run.txt
          git commit -m 'Record validated WebRadio favorites hotfix [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
