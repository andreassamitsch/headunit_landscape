name: Issue 210 Google TV D-pad regression

on:
  push:
    branches: [feature/google-tv-dpad-210]
    paths:
      - '.github/workflows/issue-210-tv-focus-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out dudu7-13.7.83-based TV implementation including protobuf submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify source and submodule are complete and TV changes stay scoped
        run: |
          git diff --check
          test -f metroproto/listentogether.proto
          test "$(grep -c 'tvDpadFocusGroup(tvDpadEnabled)' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt)" -eq 4
          grep -q 'if (!enabled) this else composed' app/src/dudu7/kotlin/com/metrolist/music/variant/TvDpadNavigation.kt
          grep -q 'isTelevisionMode && hasLeanback && !hasAutomotive && !hasFytServices' app/src/dudu7/kotlin/com/metrolist/music/variant/TvDpadNavigation.kt
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile standard and dudu7 flavors, run Dudu7 regression tests, build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:compileGmsStandardDebugKotlin :app:testGmsDudu7DebugUnitTest :app:assembleGmsDudu7Debug --no-daemon --stacktrace
      - name: Verify candidate package, signing certificate, ABIs and checksum
        if: success()
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" > candidate-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > candidate-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370092'" candidate-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' candidate-signature.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          sha256sum "$APK" | tee candidate-sha256.txt
      - name: Upload candidate APK for review (not published in updater)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue-210-dudu7-tv-focus-unreleased
          path: |
            app/build/outputs/apk/**/*.apk
            candidate-sha256.txt
          if-no-files-found: error
          retention-days: 7
