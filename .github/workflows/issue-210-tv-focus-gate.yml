name: Issue 210 Google TV D-pad regression

on:
  push:
    branches: [feature/google-tv-dpad-210]
    paths:
      - '.github/workflows/issue-210-tv-focus-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out dudu7-13.7.83-based TV implementation
        uses: actions/checkout@v4
      - name: Verify focus changes remain scoped to dudu7 flavor
        run: |
          git diff --check
          test "$(grep -c 'tvDpadFocusGroup(tvDpadEnabled)' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt)" -eq 4
          grep -q 'if (!enabled) this else composed' app/src/dudu7/kotlin/com/metrolist/music/variant/TvDpadNavigation.kt
          grep -q 'isTelevisionMode && hasLeanback && !hasAutomotive && !hasFytServices' app/src/dudu7/kotlin/com/metrolist/music/variant/TvDpadNavigation.kt
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile standard and dudu7 flavors, run Dudu7 regression tests, build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:compileGmsStandardDebugKotlin :app:testGmsDudu7DebugUnitTest :app:assembleGmsDudu7Debug --no-daemon --stacktrace
      - name: Record candidate build hash and package path
        if: success()
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;
      - name: Upload candidate APK for review (not published)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue-210-dudu7-tv-focus-unreleased
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
