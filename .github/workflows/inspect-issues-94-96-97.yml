name: Inspect issues 94 96 97

on:
  pull_request:
    branches: [agent/issue-94-frosted-ice-global-controls]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Collect relevant source context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/source
          {
            echo '=== FILES: history / recently / fm / artwork / vehicle ==='
            find app/src -type f | grep -Ei '(history|recent|fm|radio|artwork|vehicle|appearance|preference)' | sort
            echo
            echo '=== HISTORY REFERENCES ==='
            grep -RInE 'Hörverlauf|History|history|recently played|RecentlyPlayed|playback history' app/src --include='*.kt' || true
            echo
            echo '=== FM ARTWORK REFERENCES ==='
            grep -RInE 'fm.*(artwork|thumbnail|logo)|artwork.*fm|thumbnail.*fm|logo.*fm|recognized.*(artwork|thumbnail)|songRecognition|shazam' app/src --include='*.kt' || true
          } > inspection/report.txt
          files=(
            app/build.gradle.kts
            app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt
            app/src/main/kotlin/com/metrolist/music/ui/screens/HistoryScreen.kt
            app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
            app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
            app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
            app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmStationArtwork.kt
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmNowPlayingResolver.kt
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/ReliableFmStationLogoResolver.kt
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt
          )
          for f in "${files[@]}"; do
            mkdir -p "inspection/source/$(dirname "$f")"
            cp "$f" "inspection/source/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: issues-94-96-97-source
          path: inspection/
          retention-days: 2
