name: Publish Metrolist dudu7 13.7.28 APK

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
  push:
    branches:
      - agent/dudu7-13728-combined-final

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dudu7-13728-combined-final
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Confirm validated combined source
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 1370037' app/build.gradle.kts
          grep -q 'versionName = "13.7.28"' app/build.gradle.kts
          grep -q 'PhysicalFmMediaKeyBridge.handleMediaButton' app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt
          grep -q 'startDestination = initialTab.route' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'MedienFrequenzbuch loaded' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/RtrFmCatalog.kt
          grep -q 'cloudflare-dns.com' app/src/main/kotlin/com/metrolist/music/radio/RadioDnsLogoResolver.kt
          grep -q 'RADIODNS DIREKT TESTEN' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/FmRadioDiagnostics.kt
          grep -q 'val isUgcOrPodcast' app/src/main/kotlin/com/metrolist/music/utils/YTPlayerUtils.kt

      - name: Build and verify update-compatible ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGmsDudu7Debug --no-daemon --stacktrace
          mkdir -p dist
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          cp "$APK" dist/Metrolist-dudu7-13.7.28.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging dist/Metrolist-dudu7-13.7.28.apk > dist/apk-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs dist/Metrolist-dudu7-13.7.28.apk > dist/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370037'" dist/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" dist/apk-badging.txt
          grep -q '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' dist/apk-signature.txt
          unzip -l dist/Metrolist-dudu7-13.7.28.apk | grep 'lib/arm64-v8a/'
          unzip -l dist/Metrolist-dudu7-13.7.28.apk | grep 'lib/armeabi-v7a/'
          sha256sum dist/Metrolist-dudu7-13.7.28.apk > dist/Metrolist-dudu7-13.7.28.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.28
          path: dist/*
          if-no-files-found: error
          retention-days: 14
