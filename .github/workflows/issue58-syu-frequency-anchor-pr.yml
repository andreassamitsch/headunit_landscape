name: Validate issue 58 Syu frequency anchor PR

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.head_ref == 'agent/issue-58-syu-frequency-anchor'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-58-syu-frequency-anchor
          fetch-depth: 0
          submodules: recursive

      - name: Apply confirmed Syu anchor correction
        run: python3 .github/scripts/issue58_syu_anchor_patch.py

      - name: Verify patch safety
        shell: bash
        run: |
          grep -q 'inferExternalFmDirection(previousObserved, observedFrequency)' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt
          ! grep -q 'inferExternalFmDirection(snapshot.frequency, observedFrequency)' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt
          grep -q 'versionCode = 1370054' app/build.gradle.kts
          grep -q 'versionName = "13.7.45"' app/build.gradle.kts
          ! grep -q 'command = 26' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run full Dudu7 unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Commit tested source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt \
            app/src/test/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpcTest.kt
          git commit -m 'fix(dudu7): anchor Syu direction to observed sequence [skip ci]'
          git push origin HEAD:agent/issue-58-syu-frequency-anchor

      - name: Verify and package APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.45.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.45.apk' > 'artifact/Metrolist dudu7 13.7.45.apk.sha256'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging 'artifact/Metrolist dudu7 13.7.45.apk' > artifact/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist dudu7 13.7.45.apk' > artifact/apksigner.txt
          unzip -l 'artifact/Metrolist dudu7 13.7.45.apk' > artifact/apk-contents.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370054' versionName='13.7.45-dudu7'" artifact/aapt-badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/apksigner.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.45
          path: artifact/*
          if-no-files-found: error
