name: Build Dudu7 13.7.52 Frosted FM

on:
  pull_request:
    branches: [agent/issue-94-frosted-ice-global-controls]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v3

      - name: Apply issues 94 96 97
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionCode = 1370061' app/build.gradle.kts \
            && grep -q 'Dudu7FrostTextureEnabledKey' app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt \
            && grep -q 'setArtworkUri(artworkUri)' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt; then
            echo 'Product patch already applied.'
          else
            python3 scripts/apply_issues_94_96_97.py
          fi
          rm -f .github/workflows/inspect-issues-94-96-97.yml
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A \
              app/build.gradle.kts \
              app/src/main/kotlin/com/metrolist/music/constants/PreferenceKeys.kt \
              app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt \
              app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt \
              app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt \
              app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt \
              .github/workflows/inspect-issues-94-96-97.yml
            git commit -m "Implement Frosted Ice texture and FM artwork refresh [skip ci]"
            git pull --rebase origin ${{ github.head_ref || github.ref_name }}
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Verify implementation invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 1370061' app/build.gradle.kts
          grep -q 'versionName = "13.7.52"' app/build.gradle.kts
          grep -q 'valueRange = 0f..100f' app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt
          grep -q 'Froststruktur anzeigen' app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AppearanceSettings.kt
          test "$(grep -c 'MaterialTheme(colorScheme = frostedColors)' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt)" -eq 1
          grep -q 'background = baseColors.background.copy(alpha = glassAlpha)' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
          grep -q 'setArtworkUri(artworkUri)' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt
          grep -q 'mediaMetadata?.thumbnailUrl' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace

      - name: Build and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          cp "$APK" artifacts/Metrolist-dudu7-13.7.52.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-dudu7-13.7.52.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-dudu7-13.7.52.apk > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370061'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l artifacts/Metrolist-dudu7-13.7.52.apk > artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          sha256sum artifacts/Metrolist-dudu7-13.7.52.apk > artifacts/Metrolist-dudu7-13.7.52.apk.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.52-apk
          path: |
            artifacts/Metrolist-dudu7-13.7.52.apk
            artifacts/Metrolist-dudu7-13.7.52.apk.sha256
            artifacts/apk-badging.txt
            artifacts/apk-signature.txt
            artifacts/apk-contents.txt
            artifacts/build.log
          retention-days: 14
