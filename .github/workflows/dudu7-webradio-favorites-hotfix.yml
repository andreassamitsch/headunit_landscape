name: Validate immediate WebRadio favorites hotfix

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-webradio-favorites-hotfix.yml

permissions:
  contents: write

concurrency:
  group: dudu7-webradio-favorites-hotfix
  cancel-in-progress: true

jobs:
  validate-build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      METROLIST_APPLICATION_ID: com.metrolist.music
      METROLIST_APP_NAME: Metrolist
      METROLIST_DEBUG_KEYSTORE_PATH: keystore/dudu7-debug.keystore
      METROLIST_DEBUG_KEYSTORE_PASSWORD: android
      METROLIST_DEBUG_KEY_ALIAS: androiddebugkey
      METROLIST_DEBUG_KEY_PASSWORD: android
      PACKAGE_NAME: com.metrolist.music.dudu7
      ACTIVITY_NAME: com.metrolist.music.MainActivity
      RESULTS_DIR: ui-test-results-favorites-hotfix
      APK_PATH: dist/Metrolist-Dudu7-Favorites-Hotfix-x86.apk
      ANDROID_AVD_HOME: /mnt/android-avd-favorites-hotfix
      API_LEVEL: 34
      SYSTEM_TARGET: google_atd
      DATA_PARTITION_SIZE: 1536M
      DUDU_WIDTH: 1280
      DUDU_HEIGHT: 720
      DUDU_DENSITY: 200
      STATUS_FILE: .build-metadata/dudu7-webradio-favorites-hotfix-run.txt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          submodules: recursive
          fetch-depth: 0

      - name: Record running workflow
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build-metadata
          printf 'run_id=%s\nstatus=running\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record WebRadio favorites hotfix run [skip ci]'
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Apply and verify hotfix
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_dudu7_webradio_immediate_favorites_fix.py
          python3 -m py_compile scripts/apply_dudu7_webradio_immediate_favorites_fix.py scripts/icy_round3_test_server.py
          bash -n scripts/dudu7_round3_reliability_smoke.sh scripts/run_dudu7_emulator_ci.sh
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt').read_text(encoding='utf-8')
          immediate = text.index('startFavorite(initialPlayable)')
          refresh = text.index('favoritePlayJob =', immediate)
          assert immediate < refresh
          assert 'player.playbackState != Player.STATE_READY' in text
          smoke = Path('scripts/dudu7_round3_reliability_smoke.sh').read_text(encoding='utf-8')
          assert 'favorite playback does not wait for refresh' in smoke
          PY

      - name: Compile and run Dudu7 unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --warning-mode summary 2>&1 | tee artifacts/unit-tests.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Build and verify production ARM APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts dist
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-arm.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Metrolist-Dudu7-13.7.1-WebRadio-Favorites-Fix.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging artifacts/Metrolist-Dudu7-13.7.1-WebRadio-Favorites-Fix.apk > artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Metrolist-Dudu7-13.7.1-WebRadio-Favorites-Fix.apk > artifacts/apk-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          badging = Path('artifacts/apk-badging.txt').read_text(encoding='utf-8', errors='replace')
          signature = Path('artifacts/apk-signature.txt').read_text(encoding='utf-8', errors='replace').lower()
          assert "name='com.metrolist.music.dudu7'" in badging
          assert "versioncode='160'" in badging.lower()
          assert 'd5842d9177a64c29457c57039eeadad8133a72f6a4d36498725edf3f58b3b377' in signature
          with zipfile.ZipFile('artifacts/Metrolist-Dudu7-13.7.1-WebRadio-Favorites-Fix.apk') as apk:
              names = apk.namelist()
          assert any(n.startswith('lib/arm64-v8a/') for n in names)
          assert any(n.startswith('lib/armeabi-v7a/') for n in names)
          PY
          sha256sum artifacts/Metrolist-Dudu7-13.7.1-WebRadio-Favorites-Fix.apk | tee artifacts/SHA256SUMS.txt
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Build deterministic x86 emulator APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist artifacts
          cp app/build.gradle.kts /tmp/build.gradle.production.kts
          cp app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt /tmp/RadioBrowserClient.production.kt
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          old = 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")'
          assert old in text
          gradle.write_text(text.replace(old, 'abiFilters += listOf("x86_64")', 1), encoding='utf-8')
          client = Path('app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt')
          text = client.read_text(encoding='utf-8')
          old = 'https://all.api.radio-browser.info/json/stations/byuuid'
          assert old in text
          client.write_text(text.replace(old, 'http://10.0.2.2:8000/json/stations/byuuid', 1), encoding='utf-8')
          PY
          rm -rf app/build
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --warning-mode summary 2>&1 | tee artifacts/build-x86.log
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$APK_PATH"
          unzip -l "$APK_PATH" | grep 'lib/x86_64/'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare deterministic radio service
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p radio-test-data "$RESULTS_DIR"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=24' -c:a libmp3lame -b:a 96k radio-test-data/station1.mp3
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=660:duration=24' -c:a libmp3lame -b:a 96k radio-test-data/station2.mp3
          python3 scripts/icy_round3_test_server.py --audio1 radio-test-data/station1.mp3 --audio2 radio-test-data/station2.mp3 > "$RESULTS_DIR/radio-server.log" 2>&1 &
          echo $! > "$RESULTS_DIR/radio-server.pid"
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Reclaim space and enable emulator
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf "$ANDROID_AVD_HOME"
          sudo mkdir -p "$ANDROID_AVD_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          df -h / "$ANDROID_AVD_HOME" | tee "$RESULTS_DIR/disk-after-cleanup.txt"

      - name: Run deterministic favorites regression
        shell: bash
        run: |
          set -euxo pipefail
          cp scripts/dudu7_round3_reliability_smoke.sh scripts/dudu7_ui_smoke.sh
          chmod +x scripts/run_dudu7_emulator_ci.sh scripts/dudu7_ui_smoke.sh
          scripts/run_dudu7_emulator_ci.sh

      - name: Confirm favorites regression
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'PASS: favorite starts immediately and latest selection wins delayed refresh' "$RESULTS_DIR/round3-smoke.log"
          grep -q 'PASS: stale favorite one URL persisted as current station1 URL' "$RESULTS_DIR/round3-smoke.log"
          grep -q 'PASS: stale favorite two URL persisted as current station2 URL' "$RESULTS_DIR/round3-smoke.log"
          grep -q 'PASS: embedded artist detail page rendered content' "$RESULTS_DIR/round3-smoke.log"
          ! grep -E "FATAL EXCEPTION|ANR in ${PACKAGE_NAME}" "$RESULTS_DIR/logcat.txt"

      - name: Restore production files
        if: always()
        shell: bash
        run: |
          set +e
          test -f /tmp/RadioBrowserClient.production.kt && cp /tmp/RadioBrowserClient.production.kt app/src/main/kotlin/com/metrolist/music/radio/RadioBrowserClient.kt
          test -f /tmp/build.gradle.production.kts && cp /tmp/build.gradle.production.kts app/build.gradle.kts
          rm -f scripts/dudu7_ui_smoke.sh

      - name: Commit validated source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt scripts/dudu7_round3_reliability_smoke.sh
          git diff --cached --check
          git commit -m 'Start Dudu7 WebRadio favorites immediately [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - name: Record success
        shell: bash
        run: |
          set -euxo pipefail
          sha="$(cut -d' ' -f1 artifacts/SHA256SUMS.txt)"
          printf 'run_id=%s\nstatus=success\nvalidated_commit=%s\nartifact_name=Metrolist-Dudu7-WebRadio-Favorites-Fix-%s\napk_sha256=%s\n' \
            "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$sha" > "$STATUS_FILE"
          git add "$STATUS_FILE"
          git commit -m 'Record successful WebRadio favorites hotfix [skip ci]'
          git pull --rebase origin agent/fm-radio-ui-logos-tabs
          git push origin HEAD:agent/fm-radio-ui-logos-tabs

      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Dudu7-WebRadio-Favorites-Fix-${{ github.run_id }}
          path: |
            artifacts/
            ui-test-results-favorites-hotfix/
          if-no-files-found: warn
          retention-days: 14

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git fetch origin agent/fm-radio-ui-logos-tabs
          git checkout -B agent/fm-radio-ui-logos-tabs origin/agent/fm-radio-ui-logos-tabs
          mkdir -p .build-metadata
          printf 'run_id=%s\nstatus=failure\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATUS_FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m 'Record failed WebRadio favorites hotfix [skip ci]' || exit 0
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
