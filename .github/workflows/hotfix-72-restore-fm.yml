name: Hotfix 72 Restore FM

on:
  push:
    branches:
      - agent/issue-72-restore-fm-hotfix

permissions:
  contents: write

jobs:
  restore-test-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip hotfix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-72-restore-fm-hotfix
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore last working FM implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout 8723075bb51f0b80979d2767062fb8761c3be443 -- \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FytTwMediaKeys.kt \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt \
            app/src/test/kotlin/com/metrolist/music/playback/Dudu7FytTwMediaKeysTest.kt
          rm -f app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/Dudu7FytTwController.kt
          sed -i 's/versionCode = 1370049/versionCode = 1370050/' app/build.gradle.kts
          sed -i 's/versionName = "13.7.40"/versionName = "13.7.41"/' app/build.gradle.kts
          grep -q 'versionCode = 1370050' app/build.gradle.kts
          grep -q 'versionName = "13.7.41"' app/build.gradle.kts

      - name: Verify hotfix structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/Dudu7FytTwController.kt
          grep -q 'private var twUtil: TwUtilBridge?' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'val twMediaKeys = Dudu7FytTwMediaKeys(appContext)' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionRouting.kt
          grep -q 'FYT TWUtil konnte nicht initialisiert werden' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt && exit 1 || true

      - name: Commit hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/dudu7 app/src/test/kotlin/com/metrolist/music/playback/Dudu7FytTwMediaKeysTest.kt
          git commit -m 'fix: restore working Dudu7 FM backend [skip hotfix]'
          git push origin HEAD:agent/issue-72-restore-fm-hotfix

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.41.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.41.apk' > 'artifact/Metrolist dudu7 13.7.41.apk.sha256'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist dudu7 13.7.41.apk' > artifact/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/apksigner.txt
          unzip -l 'artifact/Metrolist dudu7 13.7.41.apk' > artifact/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-contents.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.41-fm-hotfix
          path: artifact/*
          if-no-files-found: error
