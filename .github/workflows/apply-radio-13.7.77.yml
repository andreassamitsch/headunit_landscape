name: Apply Dudu7 13.7.77 radio product patch

on:
  push:
    branches:
      - agent/issues-112-164-167-168-radio-fixes-13-7-77

permissions:
  contents: write

jobs:
  apply-product-patch:
    if: ${{ !contains(github.event.head_commit.message, '[radio-fix-applied]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-112-164-167-168-radio-fixes-13-7-77
          fetch-depth: 0

      - name: Apply deterministic source transformations
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_radio_13_7_77.py
          git diff --check
          grep -q 'versionCode = 1370086' app/build.gradle.kts
          grep -q 'versionName = "13.7.77"' app/build.gradle.kts
          grep -q 'FM ${FytPhysicalRadio.formatFrequency(state.frequency)} LIVE' app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
          grep -q 'FmActiveFavouriteIdentityPolicy.allowRtrOverride' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'alternativesForProgram' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/RtrFmRepository.kt
          grep -q 'AF prüft .*MHz' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt

      - name: Commit product implementation
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts \
            app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/RtrFmRepository.kt
          git rm .github/scripts/apply_radio_13_7_77.py .github/workflows/apply-radio-13.7.77.yml
          git commit -m 'feat: implement Dudu7 radio fixes 13.7.77 (#112 #164 #167 #168) [radio-fix-applied]'
          git push origin HEAD:agent/issues-112-164-167-168-radio-fixes-13-7-77
