name: Validate issues 80 81 local RTR AF

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply location-aware AF implementation
        run: |
          if grep -q 'versionName = "13.7.46"' app/build.gradle.kts; then
            echo "Implementation already applied"
          else
            python3 .github/scripts/issues80_81_local_af_patch.py
          fi

      - name: Verify AF safety rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt').read_text()
          selector = Path('app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmAlternativeFrequencySelector.kt').read_text()
          build = Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 1370055' in build
          assert 'versionName = "13.7.46"' in build
          assert 'FmLocalAfPlanner.plan' in source
          assert 'MAX_CANDIDATES = 3' in Path('app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FmReceptionPathStore.kt').read_text()
          assert 'liveAfFrequencies + nativeFrequencies' not in source
          assert 'updatePresetLastFrequency(' not in source
          assert 'receptionPathStore?.rememberConfirmed' in source
          assert 'activeFavouriteId = favouriteId' in source
          assert 'expectedPi > 0' in selector and 'receivedPi > 0' in selector
          assert 'tryNativeAfFallback(' in source  # retained only as unused compatibility code
          print('AF safety rules verified')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run full Dudu7 unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt \
            app/src/test/kotlin/com/metrolist/music/radio/fyt/FmFavouriteModelTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(dudu7): use local PI-confirmed RTR reception paths (#80 #81)"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify and package APK
        run: |
          APK=$(find app/build/outputs/apk/gmsDudu7/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370055' versionName='13.7.46-dudu7'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt
          unzip -l "$APK" | tee apk-files.txt
          grep -q 'lib/arm64-v8a/' apk-files.txt
          grep -q 'lib/armeabi-v7a/' apk-files.txt
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.46.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.46.apk' | tee 'artifact/Metrolist dudu7 13.7.46.apk.sha256'
          stat -c '%s' 'artifact/Metrolist dudu7 13.7.46.apk' | tee artifact/apk-size.txt
          cp apk-badging.txt apk-signature.txt artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.46
          path: artifact/
          retention-days: 90
