name: Dudu7 13.7.22 RTR GPS coverage v2

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]
    paths:
      - scripts/fix_dudu7_13722_patch_escapes.py
      - .github/workflows/build-dudu7-13722-rtr-v2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Apply and persist final RTR GPS source
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/fix_dudu7_13722_patch_escapes.py
          python3 -m py_compile scripts/apply_dudu7_13722_rtr_gps.py
          python3 scripts/apply_dudu7_13722_rtr_gps.py
          git diff --check
          grep -q 'versionCode = 1370031' app/build.gradle.kts
          grep -q 'versionName = "13.7.22"' app/build.gradle.kts
          grep -q 'ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
          grep -q 'RtrFmRepository' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'GPS-Sendererkennung (RTR)' app/src/dudu7/kotlin/com/metrolist/music/ui/screens/radio/PhysicalRadioScreen.kt
          rm -f scripts/apply_dudu7_13722_rtr_gps.py scripts/fix_dudu7_13722_patch_escapes.py sitecustomize.py
          rm -f .github/workflows/build-dudu7-13722-rtr.yml .github/workflows/build-dudu7-13722-rtr-v2.yml .github/workflows/diagnose-rtr-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(dudu7): add RTR GPS station coverage [skip ci]'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      - uses: android-actions/setup-android@v3

      - name: Validate current official RTR catalogue and coverage image
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p validation
          curl -fL --retry 3 --connect-timeout 20 https://senderkataster.rtr.at/programs/ -o validation/rtr-programs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          payload=json.loads(Path('validation/rtr-programs.json').read_text())
          programs=json.loads(payload['programs']) if isinstance(payload.get('programs'),str) else payload['programs']
          bounds=json.loads(payload['bounds']) if isinstance(payload.get('bounds'),str) else payload['bounds']
          ukw=[r for r in programs if r.get('rtr_programm_typ')=='UKW']
          assert len(ukw)>=500
          assert len(bounds)>=50
          row=next(r for r in ukw if r.get('rtr_json'))
          path=row['rtr_json']
          png=path[:-4]+'png' if path.lower().endswith('json') else path
          Path('validation/coverage-url.txt').write_text(urljoin('https://senderkataster.rtr.at/',png))
          Path('validation/rtr-summary.txt').write_text(f"UKW rows: {len(ukw)}\nBounds: {len(bounds)}\nSample: {row.get('rtr_programm')} {row.get('rtr_funkst_frequenz')}\n")
          PY
          curl -fL --retry 3 --connect-timeout 20 "$(cat validation/coverage-url.txt)" -o validation/coverage.png
          file validation/coverage.png | tee validation/coverage-file.txt
          grep -q 'PNG image data' validation/coverage-file.txt

      - name: Run complete Dudu7 unit tests
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace 2>&1 | tee validation/unit-tests.log
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Build and verify update-compatible APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace 2>&1 | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          OUT='artifacts/Metrolist-dudu7-13.7.22.apk'
          test -n "$APK"
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > artifacts/apk-badging.txt
          "$BUILD_TOOLS/aapt" dump permissions "$OUT" > artifacts/apk-permissions.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" > artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370031'" artifacts/apk-badging.txt
          grep -q "versionName='13.7.22-dudu7'" artifacts/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifacts/apk-badging.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' artifacts/apk-permissions.txt
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' artifacts/apk-permissions.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l "$OUT" | tee artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          sha256sum "$OUT" > "$OUT.sha256"
          cp validation/rtr-summary.txt validation/coverage-file.txt artifacts/
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload validation and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.22
          path: |
            artifacts/
            validation/
          if-no-files-found: warn
          retention-days: 14
