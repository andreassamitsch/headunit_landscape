name: Inspect Issue 106 Content Colors

on:
  push:
    branches: [agent/issue-106-adaptive-content-complete]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Collect Kotlin sources and color report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/source
          cp -R app/src/main/kotlin inspection/source/main-kotlin
          cp -R app/src/dudu7/kotlin inspection/source/dudu7-kotlin
          {
            echo '=== EXPLICIT COLORS / CONTENT LOCALS ==='
            grep -RInE 'color[[:space:]]*=|contentColor[[:space:]]*=|LocalContentColor|ProvideTextStyle|CompositionLocalProvider|TextStyle\(|onSurface|onBackground|onPrimary|textPrimary|textSecondary|Color\.(Black|White|DarkGray|Gray|LightGray)' \
              app/src/main/kotlin app/src/dudu7/kotlin --include='*.kt' || true
            echo
            echo '=== QUEUE / ARTIST / RADIO COMPONENTS ==='
            find app/src/main/kotlin app/src/dudu7/kotlin -type f \( -iname '*Queue*.kt' -o -iname '*Artist*.kt' -o -iname '*Radio*.kt' -o -iname '*ListItem*.kt' -o -iname '*MediaMetadata*.kt' \) -print | sort
          } > inspection/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: issue-106-content-color-source
          path: inspection/
          retention-days: 2
