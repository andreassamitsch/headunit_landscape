name: Fix Dudu7 13.7.77 CI gates

on:
  push:
    branches:
      - agent/issues-112-164-167-168-radio-fixes-13-7-77

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[13777-ci-fixed]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-112-164-167-168-radio-fixes-13-7-77
          fetch-depth: 0
      - name: Patch workflow gates
        run: |
          set -euxo pipefail
          python3 .github/scripts/fix_13777_ci.py
          git diff --check
          grep -q '\-ge 2' .github/workflows/build-dudu7-13.7.77.yml
          grep -q "github.head_ref == 'agent/issues-112-164-fm-rds-af-13-7-76'" .github/workflows/build-dudu7-13.7.76.yml
      - name: Commit workflow correction
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-dudu7-13.7.76.yml .github/workflows/build-dudu7-13.7.77.yml
          git rm .github/scripts/fix_13777_ci.py .github/workflows/fix-13777-ci.yml
          git commit -m 'ci: scope 13.7.76 workflow and correct 13.7.77 gate [13777-ci-fixed]'
          git push origin HEAD:agent/issues-112-164-167-168-radio-fixes-13-7-77
