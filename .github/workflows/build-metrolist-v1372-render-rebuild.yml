name: Pause Metrolist validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-metrolist-v1372-render-rebuild.yml'
  workflow_dispatch:

concurrency:
  group: metrolist-v1372-non-lazy-artist
  cancel-in-progress: true

jobs:
  pause:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Confirm paused state
        run: echo 'Metrolist validation is paused pending user review.'
