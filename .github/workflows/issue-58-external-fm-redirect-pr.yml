name: Validate external Syu FM redirect PR

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - 'app/**'

permissions:
  contents: write

jobs:
  validate-external-fm:
    if: github.head_ref == 'agent/issue-58-external-fm-favourite-redirect'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set version 13.7.44
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          if 'versionCode = 1370053' not in text:
              if text.count('versionCode = 1370052') != 1 or text.count('versionName = "13.7.43"') != 1:
                  raise SystemExit('Unexpected current version')
              text = text.replace('versionCode = 1370052', 'versionCode = 1370053', 1)
              text = text.replace('versionName = "13.7.43"', 'versionName = "13.7.44"', 1)
              path.write_text(text)
          PY

      - name: Verify safety constraints
        shell: bash
        run: |
          set -euo pipefail
          IPC=app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7SyuRadioIpc.kt
          RADIO=app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'versionCode = 1370053' app/build.gradle.kts
          grep -q 'versionName = "13.7.44"' app/build.gradle.kts
          grep -q 'SYU_RADIO_MODULE = 1' "$IPC"
          grep -q 'SYU_STEER_MODULE = 10' "$IPC"
          grep -q 'redirectExternalTune' "$IPC"
          grep -q 'PhysicalFmMediaKeyBridge.handleDirection' "$IPC"
          grep -q 'sourceOwnerPackage != appContext.packageName' "$IPC"
          grep -q 'snapshot.isBusy' "$IPC"
          grep -q 'snapshot.isScanning' "$IPC"
          grep -q 'val openOk = fm.openDev()' "$RADIO"
          ! grep -q 'extractSyuMediaKeyCandidate' "$IPC"
          ! grep -Eq 'module\.cmd\([^\n]*26|command *= *26' "$IPC"
          ! grep -qi 'twutil' "$RADIO"

      - name: Commit version to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/build.gradle.kts; then
            echo 'Version already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle.kts
            git commit -m 'build: set Dudu7 version 13.7.44 [skip external-fm]'
            git push origin HEAD:agent/issue-58-external-fm-favourite-redirect
          fi

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist dudu7 13.7.44.apk'
          sha256sum 'artifact/Metrolist dudu7 13.7.44.apk' > 'artifact/Metrolist dudu7 13.7.44.apk.sha256'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging 'artifact/Metrolist dudu7 13.7.44.apk' > artifact/aapt-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist dudu7 13.7.44.apk' > artifact/apksigner.txt
          unzip -l 'artifact/Metrolist dudu7 13.7.44.apk' > artifact/apk-contents.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370053' versionName='13.7.44-dudu7'" artifact/aapt-badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/apksigner.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-contents.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.44-external-fm-redirect
          path: artifact/*
          if-no-files-found: error
