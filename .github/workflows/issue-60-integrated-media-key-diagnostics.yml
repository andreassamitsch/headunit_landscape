name: Issue 60 integrated media-key diagnostics

on:
  push:
    branches:
      - agent/issue-60-integrated-media-key-diagnostics

permissions:
  contents: write

jobs:
  implement-test-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/issue-60-integrated-media-key-diagnostics
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Issue 60 implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/build.gradle.kts",
              '        versionCode = 1370043\n        versionName = "13.7.34"',
              '        versionCode = 1370044\n        versionName = "13.7.35"',
          )

          manifest_activity = '''        <activity
                      android:name=".playback.MediaKeyDiagnosticsActivity"
                      android:exported="true"
                      android:label="Metrolist Media-Key-Diagnose"
                      android:screenOrientation="landscape"
                      android:theme="@style/Theme.Metrolist">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
          '''
          replace_once("app/src/dudu7/AndroidManifest.xml", manifest_activity, "")

          settings_anchor = '''                val showChangelog = com.metrolist.music.LocalChangelogState.current
          '''
          settings_insert = '''                if (BuildConfig.IS_DUDU7) {
                      add(
                          Material3SettingsItem(
                              icon = painterResource(R.drawable.info),
                              title = { Text("Media-Key-Diagnose") },
                              description = {
                                  Text(
                                      text = "Lenkradtasten, MediaSession und Playerbefehle protokollieren",
                                      style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              },
                              onClick = { navController.navigate("settings/media_key_diagnostics") },
                          ),
                      )
                  }
                  val showChangelog = com.metrolist.music.LocalChangelogState.current
          '''
          replace_once(
              "app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt",
              settings_anchor,
              settings_insert,
          )

          navigation_import_anchor = '''import com.metrolist.music.ui.screens.settings.ContentSettings
          '''
          navigation_import = '''import com.metrolist.music.ui.screens.settings.ContentSettings
          import com.metrolist.music.ui.screens.settings.MediaKeyDiagnosticsSettings
          '''
          replace_once(
              "app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt",
              navigation_import_anchor,
              navigation_import,
          )

          navigation_route_anchor = '''    composable("settings/appearance") {
                  AppearanceSettings(navController, activity, snackbarHostState)
              }
          '''
          navigation_route = '''    composable("settings/media_key_diagnostics") {
                  MediaKeyDiagnosticsSettings(navController)
              }
          
              composable("settings/appearance") {
                  AppearanceSettings(navController, activity, snackbarHostState)
              }
          '''
          replace_once(
              "app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt",
              navigation_route_anchor,
              navigation_route,
          )

          diagnostics_anchor = '''    fun snapshot(context: Context): String = synchronized(lock) {
          '''
          diagnostics_methods = '''    fun entryCount(context: Context): Int = synchronized(lock) {
                  val file = logFile(context.applicationContext)
                  if (!file.isFile || file.length() == 0L) 0 else file.useLines(Charsets.UTF_8) { it.count() }
              }
          
              fun logSizeBytes(context: Context): Long = synchronized(lock) {
                  logFile(context.applicationContext).takeIf(File::isFile)?.length() ?: 0L
              }
          
              fun snapshot(context: Context): String = synchronized(lock) {
          '''
          replace_once(
              "app/src/main/kotlin/com/metrolist/music/playback/MediaKeyDiagnostics.kt",
              diagnostics_anchor,
              diagnostics_methods,
          )

          music_import_anchor = '''import com.metrolist.music.MainActivity
          import com.metrolist.music.R
          '''
          music_import = '''import com.metrolist.music.BuildConfig
          import com.metrolist.music.MainActivity
          import com.metrolist.music.R
          '''
          replace_once(
              "app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt",
              music_import_anchor,
              music_import,
          )

          listener_anchor = '''        player = createExoPlayer(prefs = startupPrefs!!)
                  player.addListener(this@MusicService)
                  sleepTimer =
          '''
          listener_insert = '''        player = createExoPlayer(prefs = startupPrefs!!)
                  player.addListener(this@MusicService)
                  if (BuildConfig.IS_DUDU7) {
                      player.addListener(
                          object : Player.Listener {
                              override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                                  MediaKeyDiagnostics.record(
                                      this@MusicService,
                                      "PLAYER_TRANSITION",
                                      "reason=$reason mediaId=${mediaItem?.mediaId.orEmpty()} " +
                                          "count=${player.mediaItemCount} index=${player.currentMediaItemIndex}",
                                  )
                              }
          
                              override fun onPlayWhenReadyChanged(playWhenReady: Boolean, reason: Int) {
                                  MediaKeyDiagnostics.record(
                                      this@MusicService,
                                      "PLAYER_PLAY_WHEN_READY",
                                      "value=$playWhenReady reason=$reason mediaId=${player.currentMediaItem?.mediaId.orEmpty()}",
                                  )
                              }
          
                              override fun onIsPlayingChanged(isPlaying: Boolean) {
                                  MediaKeyDiagnostics.record(
                                      this@MusicService,
                                      "PLAYER_IS_PLAYING",
                                      "value=$isPlaying mediaId=${player.currentMediaItem?.mediaId.orEmpty()}",
                                  )
                              }
                          },
                      )
                  }
                  sleepTimer =
          '''
          replace_once(
              "app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt",
              listener_anchor,
              listener_insert,
          )

          old_activity = Path("app/src/dudu7/kotlin/com/metrolist/music/playback/MediaKeyDiagnosticsActivity.kt")
          if not old_activity.is_file():
              raise SystemExit("Expected old diagnostics activity to exist")
          old_activity.unlink()

          screen = Path("app/src/main/kotlin/com/metrolist/music/ui/screens/settings/MediaKeyDiagnosticsSettings.kt")
          screen.write_text(r'''/**
           * Metrolist dudu7 Media-Key diagnostics.
           */
          package com.metrolist.music.ui.screens.settings
          
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.WindowInsetsSides
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.only
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.weight
          import androidx.compose.foundation.layout.windowInsetsPadding
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.selection.SelectionContainer
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.ElevatedCard
          import androidx.compose.material3.ExperimentalMaterial3Api
          import androidx.compose.material3.FilledTonalButton
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Switch
          import androidx.compose.material3.Text
          import androidx.compose.material3.TopAppBar
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.core.content.FileProvider
          import androidx.navigation.NavController
          import com.metrolist.music.BuildConfig
          import com.metrolist.music.LocalPlayerAwareWindowInsets
          import com.metrolist.music.R
          import com.metrolist.music.playback.MediaKeyDiagnostics
          import com.metrolist.music.ui.component.IconButton
          import com.metrolist.music.ui.utils.backToMain
          import kotlinx.coroutines.delay
          
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MediaKeyDiagnosticsSettings(navController: NavController) {
              val context = LocalContext.current
              var recording by remember { mutableStateOf(MediaKeyDiagnostics.isEnabled(context)) }
              var entryCount by remember { mutableIntStateOf(0) }
              var logSizeBytes by remember { mutableLongStateOf(0L) }
              var logText by remember { mutableStateOf("") }
          
              fun refresh() {
                  recording = MediaKeyDiagnostics.isEnabled(context)
                  entryCount = MediaKeyDiagnostics.entryCount(context)
                  logSizeBytes = MediaKeyDiagnostics.logSizeBytes(context)
                  logText = MediaKeyDiagnostics.snapshot(context)
              }
          
              LaunchedEffect(Unit) {
                  MediaKeyDiagnostics.record(context, "DIAGNOSTICS", "settings screen opened")
                  while (true) {
                      refresh()
                      delay(750)
                  }
              }
          
              val insets = LocalPlayerAwareWindowInsets.current
              Column(
                  modifier =
                      Modifier
                          .fillMaxSize()
                          .windowInsetsPadding(insets.only(WindowInsetsSides.Horizontal + WindowInsetsSides.Bottom))
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 16.dp),
              ) {
                  Spacer(Modifier.windowInsetsPadding(insets.only(WindowInsetsSides.Top)))
          
                  ElevatedCard(modifier = Modifier.fillMaxWidth()) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  text = "Aufzeichnung",
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.SemiBold,
                              )
                              Text(
                                  text = "$entryCount Einträge · $logSizeBytes Bytes",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              Text(
                                  text = "Läuft auch weiter, wenn du zum Player, Webradio oder FM zurückgehst.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                          Switch(
                              checked = recording,
                              onCheckedChange = {
                                  MediaKeyDiagnostics.setEnabled(context, it)
                                  refresh()
                              },
                          )
                      }
                  }
          
                  Spacer(Modifier.height(12.dp))
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                  ) {
                      FilledTonalButton(
                          onClick = { refresh() },
                          modifier = Modifier.weight(1f),
                      ) { Text("Aktualisieren") }
                      FilledTonalButton(
                          onClick = {
                              val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              clipboard.setPrimaryClip(
                                  ClipData.newPlainText("Metrolist Media-Key-Diagnose", MediaKeyDiagnostics.snapshot(context)),
                              )
                              Toast.makeText(context, "Diagnose wurde kopiert", Toast.LENGTH_SHORT).show()
                          },
                          modifier = Modifier.weight(1f),
                      ) { Text("Alles kopieren") }
                  }
          
                  Spacer(Modifier.height(8.dp))
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                  ) {
                      FilledTonalButton(
                          onClick = {
                              val file = MediaKeyDiagnostics.exportFile(context)
                              val uri = FileProvider.getUriForFile(
                                  context,
                                  "${BuildConfig.APPLICATION_ID}.FileProvider",
                                  file,
                              )
                              val share = Intent(Intent.ACTION_SEND).apply {
                                  type = "text/plain"
                                  putExtra(Intent.EXTRA_STREAM, uri)
                                  putExtra(Intent.EXTRA_SUBJECT, "Metrolist dudu7 Media-Key-Diagnose")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  clipData = ClipData.newRawUri("Media-Key-Diagnose", uri)
                              }
                              context.startActivity(Intent.createChooser(share, "Diagnose teilen"))
                          },
                          modifier = Modifier.weight(1f),
                      ) { Text("TXT teilen") }
                      FilledTonalButton(
                          onClick = {
                              MediaKeyDiagnostics.clear(context)
                              refresh()
                          },
                          modifier = Modifier.weight(1f),
                      ) { Text("Log löschen") }
                  }
          
                  Spacer(Modifier.height(16.dp))
                  Text(
                      text = "Protokoll",
                      style = MaterialTheme.typography.titleMedium,
                      fontWeight = FontWeight.SemiBold,
                  )
                  Text(
                      text = "Die Ansicht aktualisiert sich automatisch. Der Text kann auch direkt markiert und kopiert werden.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  Spacer(Modifier.height(8.dp))
                  ElevatedCard(modifier = Modifier.fillMaxWidth()) {
                      SelectionContainer {
                          Text(
                              text = logText,
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              style = MaterialTheme.typography.bodySmall,
                              fontFamily = FontFamily.Monospace,
                          )
                      }
                  }
                  Spacer(Modifier.height(24.dp))
              }
          
              TopAppBar(
                  title = { Text("Media-Key-Diagnose") },
                  navigationIcon = {
                      IconButton(
                          onClick = navController::navigateUp,
                          onLongClick = navController::backToMain,
                      ) {
                          Icon(
                              painter = painterResource(R.drawable.arrow_back),
                              contentDescription = null,
                          )
                      }
                  },
              )
          }
          ''', encoding="utf-8")
          PY

          git diff --check

          test ! -f app/src/dudu7/kotlin/com/metrolist/music/playback/MediaKeyDiagnosticsActivity.kt
          ! grep -q 'Metrolist Media-Key-Diagnose' app/src/dudu7/AndroidManifest.xml
          grep -q 'settings/media_key_diagnostics' app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt
          grep -q 'MediaKeyDiagnosticsSettings(navController)' app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt
          grep -q 'PLAYER_TRANSITION' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'versionName = "13.7.35"' app/build.gradle.kts

      - name: Run Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build Dudu7 APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/gms/dudu7/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370044' versionName='13.7.35-dudu7'" /tmp/badging.txt
          grep -q "application-label:'Metrolist dudu7'" /tmp/badging.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          cp "$APK" "Metrolist dudu7 13.7.35.apk"
          sha256sum "Metrolist dudu7 13.7.35.apk" | tee "Metrolist dudu7 13.7.35.apk.sha256"

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.35
          path: |
            Metrolist dudu7 13.7.35.apk
            Metrolist dudu7 13.7.35.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit tested product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/dudu7/AndroidManifest.xml \
            app/src/dudu7/kotlin/com/metrolist/music/playback/MediaKeyDiagnosticsActivity.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MediaKeyDiagnostics.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/NavigationBuilder.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/SettingsScreen.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/settings/MediaKeyDiagnosticsSettings.kt
          git commit -m "Integrate media-key diagnostics into settings [skip ci]"
          git push origin HEAD:agent/issue-60-integrated-media-key-diagnostics
