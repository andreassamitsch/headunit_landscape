name: Inspect Issues 97 106 Visual State

on:
  push:
    branches: [agent/issues-97-106-fm-visual-contrast]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Collect visual-state sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/source
          files=(
            app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt
            app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt
            app/src/dudu7/kotlin/com/metrolist/music/variant/PhysicalRadioPlayerPane.kt
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt
            app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleVariantConfig.kt
            app/src/main/kotlin/com/metrolist/music/radio/fyt/FmNowPlayingResolver.kt
            app/src/main/kotlin/com/metrolist/music/radio/fyt/ReliableFmStationLogoResolver.kt
            app/src/main/kotlin/com/metrolist/music/playback/Dudu7SourcePlaybackCoordinator.kt
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "inspection/source/$(dirname "$file")"
              cp "$file" "inspection/source/$file"
            fi
          done
          {
            echo '=== FILES ==='
            find inspection/source -type f -print | sort
            echo
            echo '=== PLAYER ARTWORK REFERENCES ==='
            grep -RInE 'mediaMetadata|thumbnailUrl|gradientColors|TextBackgroundColor|VehicleLandscapeLayout|AsyncImage|AnimatedContent|playerBackground' app/src/main/kotlin/com/metrolist/music/ui/player/Player.kt || true
            echo
            echo '=== FM STATE / ARTWORK REFERENCES ==='
            grep -RInE 'FmNowPlayingResolver|ReliableFmStationLogoResolver|FytPhysicalRadio|artworkUri|coverUrl|displayStation|Dudu7SourcePlaybackCoordinator' app/src/dudu7 app/src/main --include='*.kt' || true
            echo
            echo '=== DUDU7 THEME CONTENT TOKENS ==='
            grep -RInE 'frostedColors|onBackground|onSurface|onSurfaceVariant|onPrimaryContainer|onSecondaryContainer|onTertiaryContainer|onErrorContainer|outlineVariant|contentColor' app/src/dudu7/kotlin/com/metrolist/music/variant/VehicleLandscapeLayout.kt || true
          } > inspection/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: issues-97-106-visual-source
          path: inspection/
          retention-days: 2
