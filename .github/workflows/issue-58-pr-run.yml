name: Apply and verify issue 58

on:
  pull_request:
    branches: [agent/fm-radio-ui-logos-tabs]

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.head_ref == 'agent/issue-58-media-key-routing-diagnostics'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Extract and apply implementation patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .assistant
          awk '/<<'"'"'B64'"'"'/{capture=1;next} /^[[:space:]]*B64$/{capture=0} capture{gsub(/^[[:space:]]+/, ""); print}' \
            .github/workflows/issue-58-media-keys.yml > /tmp/issue58.py.gz.b64
          base64 -d /tmp/issue58.py.gz.b64 | gzip -d > .assistant/apply_issue_58.py
          python3 .assistant/apply_issue_58.py
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - uses: android-actions/setup-android@v3

      - name: Run complete Dudu7 unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testGmsDudu7DebugUnitTest --no-daemon --stacktrace
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Build and verify update APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/source
          ./gradlew --console=plain :app:assembleGmsDudu7Debug --no-daemon --stacktrace | tee artifacts/build.log
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | grep '/gmsDudu7/debug/' | head -1)
          test -n "$APK"
          OUT="artifacts/Metrolist-dudu7-13.7.34.apk"
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | tee artifacts/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee artifacts/apk-signature.txt
          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370043'" artifacts/apk-badging.txt
          grep -q "versionName='13.7.34-dudu7'" artifacts/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifacts/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifacts/apk-signature.txt
          unzip -l "$OUT" | tee artifacts/apk-contents.txt
          grep -q 'lib/arm64-v8a/' artifacts/apk-contents.txt
          grep -q 'lib/armeabi-v7a/' artifacts/apk-contents.txt
          sha256sum "$OUT" | tee "$OUT.sha256"
          git diff --binary > artifacts/source/issue-58-product.patch
          tar -czf artifacts/source/issue-58-product-files.tar.gz \
            app/build.gradle.kts \
            app/src/dudu7/AndroidManifest.xml \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7MediaButtonReceiver.kt \
            app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt \
            app/src/dudu7/kotlin/com/metrolist/music/playback/MediaKeyDiagnosticsActivity.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MediaKeyDiagnostics.kt \
            app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt \
            app/src/main/kotlin/com/metrolist/music/radio/WebRadioFavouriteQueue.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
            app/src/test/kotlin/com/metrolist/music/playback/Dudu7MediaButtonRoutingTest.kt \
            app/src/test/kotlin/com/metrolist/music/radio/WebRadioFavouriteQueueTest.kt
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.34
          path: artifacts/
          retention-days: 14

      - name: Commit tested product source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf artifacts .assistant
          git rm -f .github/workflows/issue-58-media-keys.yml .github/workflows/issue-58-pr-run.yml || true
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Fix Dudu7 media-key routing and add diagnostics'
          git push origin HEAD:agent/issue-58-media-key-routing-diagnostics
