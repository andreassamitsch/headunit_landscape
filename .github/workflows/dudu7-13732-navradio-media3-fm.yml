name: Dudu7 13.7.32 NavRadio-style FM Media3 player

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - '.github/workflows/dudu7-13732-navradio-media3-fm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify implementation scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Dudu7FmSessionRouting.install' app/src/dudu7/kotlin/com/metrolist/music/radio/fyt/FytPhysicalRadio.kt
          grep -q 'observePhysicalFmSession()' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'PhysicalFmSessionBridge.owns(session.player)' app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt
          grep -q 'Dudu7FmSessionNavigation.adjacentIndex' app/src/dudu7/kotlin/com/metrolist/music/playback/Dudu7FmSessionPlayer.kt
          grep -q 'versionCode = 1370041' app/build.gradle.kts
          grep -q 'versionName = "13.7.32"' app/build.gradle.kts

      - name: Run FM MediaSession navigation regression tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --tests 'com.metrolist.music.playback.Dudu7FmSessionNavigationTest' --stacktrace

      - name: Run complete Dudu7 unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build update-compatible APK
        env:
          METROLIST_APP_NAME: Metrolist dudu7
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Prepare and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" 'artifact/Metrolist-dudu7-13.7.32.apk'
          sha256sum 'artifact/Metrolist-dudu7-13.7.32.apk' | tee 'artifact/Metrolist-dudu7-13.7.32.apk.sha256'

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging 'artifact/Metrolist-dudu7-13.7.32.apk' | tee artifact/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs 'artifact/Metrolist-dudu7-13.7.32.apk' | tee artifact/apk-signature.txt
          unzip -l 'artifact/Metrolist-dudu7-13.7.32.apk' > artifact/apk-list.txt

          grep -q "package: name='com.metrolist.music.dudu7.debug' versionCode='1370041' versionName='13.7.32-dudu7'" artifact/apk-badging.txt
          grep -q "application-label:'Metrolist dudu7'" artifact/apk-badging.txt
          grep -qi '138bf5c8338174eb09a847b7a1e60462b6ca1a108b04d512cc79fcfc150a06ee' artifact/apk-signature.txt
          grep -q 'lib/arm64-v8a/' artifact/apk-list.txt
          grep -q 'lib/armeabi-v7a/' artifact/apk-list.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.32
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
