name: Trigger corrected Dudu7 round 3 workflow

on:
  push:
    branches:
      - agent/fm-radio-ui-logos-tabs
    paths:
      - .github/workflows/dudu7-round3-retry-trigger.yml

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fm-radio-ui-logos-tabs
          fetch-depth: 0
      - name: Add corrected architecture patch to main workflow
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/dudu7-reliability-round3.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '          python3 scripts/apply_dudu7_fm_recognition_round3.py\n',
                  '          python3 scripts/apply_dudu7_fm_recognition_round3.py\n'
                  '          python3 scripts/apply_dudu7_architecture_round3.py\n',
              ),
              (
                  '            scripts/apply_dudu7_fm_recognition_round3.py \\\n'
                  '            scripts/icy_round3_test_server.py\n',
                  '            scripts/apply_dudu7_fm_recognition_round3.py \\\n'
                  '            scripts/apply_dudu7_architecture_round3.py \\\n'
                  '            scripts/icy_round3_test_server.py\n',
              ),
              (
                  '            app/src/test/kotlin/com/metrolist/music/playback/LatestRequestGateTest.kt\n',
                  '            app/src/test/kotlin/com/metrolist/music/playback/LatestRequestGateTest.kt \\\n'
                  '            scripts/verify_dudu7_architecture.py\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'workflow token missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/dudu7-reliability-round3.yml
          git commit -m 'Correct round 3 architecture validation'
          git push origin HEAD:agent/fm-radio-ui-logos-tabs
