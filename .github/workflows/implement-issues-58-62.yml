name: Implement Issues 58 and 62

on:
  pull_request:
    branches:
      - agent/fm-radio-ui-logos-tabs

permissions:
  contents: write

jobs:
  implement-test-build:
    if: github.event.pull_request.head.ref == 'agent/issues-58-62-media-navigation-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply product changes
        run: python3 .github/scripts/implement-issues-58-62.py

      - name: Unit tests
        run: ./gradlew :app:testGmsDudu7DebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleGmsDudu7Debug --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "Metrolist dudu7 13.7.35.apk"
          sha256sum "Metrolist dudu7 13.7.35.apk" | tee "Metrolist dudu7 13.7.35.apk.sha256"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt -o -name aapt2 \) | sort -V | tail -n 1)"
          "$AAPT" dump badging "Metrolist dudu7 13.7.35.apk" | grep -E "package: name='com.metrolist.music.dudu7.debug'.*versionCode='1370044'.*versionName='13.7.35-dudu7'"
          unzip -l "Metrolist dudu7 13.7.35.apk" | grep 'lib/arm64-v8a/'
          unzip -l "Metrolist dudu7 13.7.35.apk" | grep 'lib/armeabi-v7a/'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "Metrolist dudu7 13.7.35.apk" | grep 'Verified using v2 scheme (APK Signature Scheme v2): true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-dudu7-13.7.35
          path: |
            Metrolist dudu7 13.7.35.apk
            Metrolist dudu7 13.7.35.apk.sha256
          if-no-files-found: error

      - name: Commit tested product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt \
            app/src/main/kotlin/com/metrolist/music/radio/WebRadioFavouriteQueue.kt \
            app/src/main/kotlin/com/metrolist/music/ui/screens/radio/WebRadioScreen.kt \
            app/src/test/kotlin/com/metrolist/music/radio/WebRadioFavouriteQueueTest.kt
          git commit -m "Fix FM hardware routing and WebRadio queue order"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
